        var d=moData[mo+'|'+site+'|'+td];
        var prev=prevMo?moData[prevMo+'|'+site+'|'+td]:null;
        if(!d||!d.cost) {
          tr+='<td style="text-align:right;color:var(--t3);font-size:11px">—</td>'
             +'<td style="text-align:right;color:var(--t3);font-size:11px">—</td>';
        } else {
          tr+='<td style="text-align:right;font-size:11px;color:'+tdColor(td)+';font-family:\'JetBrains Mono\',monospace;font-weight:600">'+fmtRp(d.cost)+momCost(d.cost,prev?prev.cost:null)+'</td>'
             +'<td style="text-align:right;font-size:10px;color:var(--t2);font-family:\'JetBrains Mono\',monospace">'+fmtRp(d.costTrip)+'</td>';
        }
      });
      var prevTot=prevMo?moData[prevMo+'|'+site+'|_total']:null;
      tr+='<td style="text-align:right;font-size:11px;font-weight:700;color:#1d4ed8;font-family:\'JetBrains Mono\',monospace">'+fmtRp(tot.cost)+momCost(tot.cost,prevTot?prevTot.cost:null)+'</td>';
      tr+='</tr>';
      tbody+=tr;
    });
  });

  container.innerHTML=
    '<div style="overflow-x:auto"><table class="mtt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
}

// ── TRIP COUNT BY TYPE DELIVERY (r.td) ─────────────────────────
// COUNTUNIQUE r.lc (kolom A) grouped by r.td (kolom J / Type Delivery)
// Types auto-discovered from data. Fixed color per type for consistency.
function buildMonthlyTripTypeTable(container) {
  if (!container) return;
  const moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const {start: fs, end: fe} = getRange();
  const allMonths = [...new Set(ROWS.map(r => r.date ? r.date.slice(0,7) : null).filter(Boolean))].sort();
  const SITES_LIST = currentSite==='ALL' ? SITES : currentSite==='NDC_RDC' ? ['NDC_RDC'] : currentSite==='NDC' ? ['NDC'] : currentSite==='RDC' ? ['RDC'] : [currentSite];

  // ── 1. Discover all unique r.td values present in data ──
  const tdSet = new Set();
  ROWS.forEach(r => { if (r.td) tdSet.add((r.td+'').toLowerCase().trim()); });

  // ── 2. Compute COUNTUNIQUE r.lc per month per site per td ──
  var allData = {}; // key: mo+'|'+site → { td: Set<lc>, _total: Set<lc> }
  allMonths.forEach(function(mo) {
    var daysInMo=new Date(parseInt(mo.slice(0,4)),parseInt(mo.slice(5,7)),0).getDate();
    var moD1=mo+'-'+String(parseInt(fs.slice(8,10))).padStart(2,'0');
    var moD2=mo+'-'+String(Math.min(parseInt(fe.slice(8,10)),daysInMo)).padStart(2,'0');
    SITES_LIST.forEach(function(site) {
      var moFiltered = filterRows(ROWS, moD1, moD2, site);
      var sub = SUB_SITES[site];
      var sr;
      if(site==='NDC_RDC'||site==='NDC'||site==='RDC') {
        sr = moFiltered; // already filtered by group
      } else {
        var effectiveSite = sub ? sub.baseSite : site;
        sr = moFiltered.filter(r => r.site === effectiveSite);
      }
      if (!sr.length) return;
      var entry = { _total: new Set() };
      sr.forEach(r => {
        if (!r.lc) return;
        var td = (r.td || '').toLowerCase().trim();
        // null / empty / #n/a → count in total only, no column
        var isUnknown = !td || td === '#n/a' || td === 'n/a' || td === '-' || td === '#value!';
        entry['_total'].add(r.lc);
        if (isUnknown) return;
        // "customer via hub" & variants → grouped into 'customer'
        if (td === 'customer via hub' || td === 'hub customer' || td === 'customer hub') td = 'customer';
        if (!entry[td]) entry[td] = new Set();
        entry[td].add(r.lc);
      });
      allData[mo + '|' + site] = entry;
    });
  });

  // ── 3. Order td types: customer > store > hub > satelite > transfer > pickup > others ──
  const TD_ORDER = ['customer','store','hub','satelite','transfer'];
  var allTdFound = [...new Set(
    Object.values(allData).flatMap(e => Object.keys(e).filter(k => k !== '_total'))
  )];
  var tdTypes = [
    ...TD_ORDER.filter(t => allTdFound.includes(t)),
    ...allTdFound.filter(t => !TD_ORDER.includes(t)).sort()
  ];

  // ── 4. MoM badge for total ──
  function momBadge(cur, prev) {
    if (cur == null || prev == null) return '';
    var d = cur - prev;
    if (d === 0) return '';
    var color = d > 0 ? '#0f9d58' : '#d93025';
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+' '+Math.abs(d).toLocaleString('id-ID')+'</span>';
  }

  // ── 5. Build thead ──
  var thead = '<tr>'
    + '<th style="text-align:left;min-width:80px">Bulan</th>'
    + '<th style="text-align:left;min-width:90px">Site</th>';
  tdTypes.forEach(function(td) {
    thead += '<th style="text-align:center;color:'+tdColor(td)+'">'+tdLabel(td)+'</th>';
  });
  thead += '<th style="text-align:center;background:#f0f4f9">TOTAL TRIP</th></tr>';

  // ── 6. Build tbody ──
  var tbody = '';
  allMonths.forEach(function(mo, moIdx) {
    var prevMo = moIdx > 0 ? allMonths[moIdx - 1] : null;
    SITES_LIST.forEach(function(site) {
      var key = mo + '|' + site;
      var entry = allData[key];
      if (!entry) return;
      var total = entry['_total'].size;
      if (!total) return;
      var prevEntry = prevMo ? allData[prevMo + '|' + site] : null;
      var prevTotal = prevEntry ? prevEntry['_total'].size : null;
      var mn = moNames[parseInt(mo.slice(5,7)) - 1] + ' ' + mo.slice(0,4);
      var siteLbl = SL[site] || site;
      var tr = '<tr>';
      tr += '<td style="color:var(--t2);font-size:11px;white-space:nowrap">'+mn+'</td>';
      tr += '<td style="font-weight:600;font-size:11px">'+siteLbl+'</td>';
      tdTypes.forEach(function(td) {
        var cnt = entry[td] ? entry[td].size : 0;
        var prevCnt = prevEntry && prevEntry[td] ? prevEntry[td].size : null;
        var pct = total > 0 ? (cnt / total * 100).toFixed(1) : '0.0';
        if (cnt === 0) {
          tr += '<td style="text-align:center;color:var(--t3);font-size:11px">—</td>';
        } else {
          var mom = '';
          if(prevCnt!=null && cnt!==prevCnt) {
            var d = cnt - prevCnt;
            var color = d>0?'#0f9d58':'#d93025';
            mom = '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+Math.abs(d).toLocaleString('id-ID')+'</span>';
          }
          tr += '<td style="text-align:center;font-size:11px;font-weight:600;font-family:\'JetBrains Mono\',monospace">'
            + '<span style="color:'+tdColor(td)+'">'+cnt.toLocaleString('id-ID')+'</span>'
            + mom
            + '<br><span style="font-size:9px;color:var(--t3);font-weight:400">'+pct+'%</span>'
            + '</td>';
        }
      });
      tr += '<td style="text-align:center;font-size:12px;font-weight:700;font-family:\'JetBrains Mono\',monospace;background:#f0f4f9">'
        + total.toLocaleString('id-ID')
        + momBadge(total, prevTotal)
        + '</td>';
      tr += '</tr>';
      tbody += tr;
    });
  });

  // ── 7. Grand total row ──
  var grandTotals = {};
  tdTypes.forEach(function(td) {
    grandTotals[td] = Object.values(allData).reduce(function(s, e) { return s + (e[td] ? e[td].size : 0); }, 0);
  });
  var grandTotal = Object.values(allData).reduce(function(s, e) { return s + e['_total'].size; }, 0);
  var sumRow = '<tr style="background:var(--gbg);border-top:2px solid var(--gl)">';
  sumRow += '<td colspan="2" style="font-size:11px;color:var(--green);font-weight:700;padding:7px 10px">GRAND TOTAL</td>';
  tdTypes.forEach(function(td) {
    var cnt = grandTotals[td];
    var pct = grandTotal > 0 ? (cnt / grandTotal * 100).toFixed(1) : '0.0';
    sumRow += '<td style="text-align:center;font-size:11px;font-weight:700;color:var(--green);font-family:\'JetBrains Mono\',monospace">'
      + cnt.toLocaleString('id-ID')
      + '<br><span style="font-size:9px;color:var(--gm);font-weight:600">'+pct+'%</span>'
      + '</td>';
  });
  sumRow += '<td style="text-align:center;font-size:13px;font-weight:700;color:var(--green);background:var(--gbg);font-family:\'JetBrains Mono\',monospace">'
    + grandTotal.toLocaleString('id-ID') + '</td>';
  sumRow += '</tr>';

  // ── 8. Legend strip ──
  var legendHtml = '<div style="display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg)">';
  tdTypes.forEach(function(td) {
    var cnt = grandTotals[td];
    var pct = grandTotal > 0 ? (cnt / grandTotal * 100).toFixed(1) : '0.0';
    legendHtml += '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">'
      + '<span style="width:10px;height:10px;border-radius:50%;background:'+tdColor(td)+';flex-shrink:0;display:inline-block"></span>'
      + '<strong style="color:'+tdColor(td)+'">'+tdLabel(td)+'</strong>'
      + '<span style="color:var(--t3)">'+cnt.toLocaleString('id-ID')+' trip · '+pct+'%</span>'
      + '</span>';
  });
  legendHtml += '</div>';

  container.innerHTML =
    '<div style="overflow-x:auto">'
    + '<table class="mtt"><thead>' + thead + '</thead><tbody>' + tbody + sumRow + '</tbody></table>'
    + '</div>'
    + legendHtml;
}

function generatePPT() {
  if(typeof PptxGenJS === 'undefined') { document.getElementById('pptStatus').textContent = '❌ Library belum load, refresh dulu'; return; }
  document.getElementById('pptStatus').textContent = '⏳ Generating...';

  var {start:s, end:e} = getRange();
  var moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var siteLabel = currentSite==='ALL'?'Semua Site':currentSite==='NDC_RDC'?'NDC & RDC':currentSite==='NDC'?'NDC':currentSite==='RDC'?'RDC':(SL[currentSite]||currentSite);

  // Only months within filter range
  var fsMonth = s.slice(0,7);
  var feMonth = e.slice(0,7);
  var allMonths = [...new Set(ROWS.map(function(r){return r.date?r.date.slice(0,7):null;}).filter(Boolean))].sort();
  allMonths = allMonths.filter(function(mo){return mo>=fsMonth && mo<=feMonth;});

  // BU definitions
  var BU_MAP = {
    'JABABEKA': [{key:'JABABEKA',label:'Corporate'},{key:'JAB_HCI',label:'HCI'},{key:'JAB_AHI',label:'AHI'},{key:'JAB_FBI',label:'FBI'},{key:'JAB_KLS',label:'KLS'}],
    'SDA':      [{key:'SDA',label:'Corporate'},{key:'SDA_HCI',label:'HCI'},{key:'SDA_AHI',label:'AHI'},{key:'SDA_FBI',label:'FBI'}],
    'CIKUPA':   [{key:'CIKUPA',label:'Corporate'}],
    'TALLO':    [{key:'TALLO',label:'Corporate'}],
    'TAMORA':   [{key:'TAMORA',label:'Corporate'}],
  };

  var SITE_LIST = currentSite==='ALL'||currentSite==='NDC_RDC'?SITES:currentSite==='NDC'?SITES_NDC:currentSite==='RDC'?SITES_RDC:SUB_SITES[currentSite]?[SUB_SITES[currentSite].baseSite]:[currentSite];

  var prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5 inches
  var CLR_TEXT='0f172a', CLR_GRAY='64748b', CLR_HDR='1e2a3a', CLR_GREEN='166534';

  // Cache results to avoid recomputing
  var _resCache = {};
  function getRes(buKey, mo) {
    var cacheKey = buKey+'|'+mo;
    if(_resCache[cacheKey] !== undefined) return _resCache[cacheKey];
    var dIM = new Date(parseInt(mo.slice(0,4)),parseInt(mo.slice(5,7)),0).getDate();
    var d1 = mo+'-'+String(parseInt(s.slice(8,10))).padStart(2,'0');
    var d2 = mo+'-'+String(Math.min(parseInt(e.slice(8,10)),dIM)).padStart(2,'0');
    var moF = filterRows(ROWS,d1,d2,buKey);
    var sub = SUB_SITES[buKey];
    var sr = sub ? moF : moF.filter(function(r){return r.site===(buKey==='JABABEKA'||buKey==='SDA'||buKey==='CIKUPA'||buKey==='TALLO'||buKey==='TAMORA'?buKey:buKey);});
    var result = computeSite(sr.length?sr:moF, buKey);
    _resCache[cacheKey] = result;
    return result;
  }

  // Pre-cache all results upfront
  function preCacheAll() {
    var months = allMonths.concat(allMonths.map(function(mo,i){return i>0?allMonths[i-1]:null;}).filter(Boolean));
    var uniqueMonths = [...new Set(months)];
    SITE_LIST.forEach(function(site){
      var bus = BU_MAP[site]||[{key:site,label:'Corporate'}];
      bus.forEach(function(bu){
        uniqueMonths.forEach(function(mo){ getRes(bu.key, mo); });
      });
    });
  }
  preCacheAll();

  function fmtV(v, type) {
    if(v==null) return '—';
    if(type==='pct') return (v*100).toFixed(1)+'%';
    if(type==='tat') return tatStr(v);
    if(type==='int') return Math.round(v).toLocaleString('id-ID');
    return v.toFixed(type||1);
  }

  function delta(cur, prev, type, hiGood) {
    if(cur==null||prev==null) return '';
    var d = cur-prev;
    if(Math.abs(d)<0.001) return '';
    var good = hiGood ? d>0 : d<0;
    var arrow = d>0?'▲':'▼';
    var color = good?'0f9d58':'d93025';
    var abs = Math.abs(d);
    var str;
    if(type==='pct') str=(abs*100).toFixed(1)+'%';
    else if(type==='tat'){var h=Math.floor(abs),m=Math.round((abs-h)*60);str=(h>0?h+'j ':'')+m+'m';}
    else if(type==='int') str=Math.round(abs).toLocaleString('id-ID');
    else str=abs<10?abs.toFixed(1):Math.round(abs).toString();
    return {text:arrow+' '+str, color:color};
  }

  function cell(txt, bold, color, align) {
    return {text:txt||'—', options:{fontSize:7.5,fontFace:'Calibri',bold:!!bold,color:color||CLR_TEXT,align:align||'center',valign:'middle'}};
  }

  function hdr(txt, color) {
    return {text:txt, options:{fontSize:7.5,fontFace:'Calibri',bold:true,color:'ffffff',fill:{type:'solid',color:color||CLR_HDR},align:'center',valign:'middle'}};
  }

  function deltaCell(d) {
    if(!d) return cell('—',false,CLR_GRAY);
    return {text:d.text, options:{fontSize:7,fontFace:'Calibri',bold:true,color:d.color,align:'center',valign:'middle'}};
  }

  // ── SLIDE 1: COVER ──
  var cov = prs.addSlide();
  cov.background={color:'1e2a3a'};
  cov.addText('Kawan Lama Group',{x:0.5,y:1.5,w:12.3,h:0.4,fontSize:13,color:'94a3b8',align:'center'});
  cov.addText('Transport Operations Performance',{x:0.5,y:2.0,w:12.3,h:0.65,fontSize:24,bold:true,color:'ffffff',align:'center'});
  cov.addText(siteLabel,{x:0.5,y:2.75,w:12.3,h:0.5,fontSize:18,bold:true,color:'86efac',align:'center'});
  var d1f=new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  var d2f=new Date(e).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  cov.addText(d1f+' s/d '+d2f,{x:0.5,y:3.3,w:12.3,h:0.35,fontSize:12,color:'94a3b8',align:'center'});

  // METRICS definition
  var METRICS = [
    {label:'Ritase',          key:'ritase',        type:1,    tgt:1.15, hi:true},
    {label:'OLF (Store)',     key:'olf',           type:'pct',tgt:0.85, hi:true},
    {label:'DP (Store)',      key:'dpStore',       type:1,    tgt:null, hi:true},
    {label:'DP (Mix)',        key:'dpMix',         type:1,    tgt:8.0,  hi:true},
    {label:'DP Non Reg',      key:'dpNonReg',      type:1,    tgt:null, hi:true},
    {label:'DP (Regular)',    key:'dpReg',         type:1,    tgt:8.0,  hi:true},
    {label:'DO/Trip (Reg)',   key:'doTrip',        type:1,    tgt:11.0, hi:true},
    {label:'DO/Trip (Mix)',   key:'doTripAll',     type:1,    tgt:null, hi:true},
    {label:'TAT Direct',      key:'tatDirect',     type:'tat',tgt:null, hi:false},
    {label:'TAT Store',       key:'tatStore',      type:'tat',tgt:null, hi:false},
    {label:'CBM Store',       key:'totalCbmStore', type:'int',tgt:null, hi:true},
    {label:'DO Customer',     key:'totalDoCust',   type:'int',tgt:null, hi:true},
    {label:'DP Customer',     key:'totalDpCust',   type:'int',tgt:null, hi:true},
  ];

  // ── PER SITE → 1 SLIDE PER MONTH ──
  SITE_LIST.forEach(function(site) {
    var bus = BU_MAP[site] || [{key:site,label:'Corporate'}];

    allMonths.forEach(function(mo, moIdx) {
      var prevMo = moIdx>0?allMonths[moIdx-1]:null;
      var moLabel = moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
      var prevLabel = prevMo?moNames[parseInt(prevMo.slice(5,7))-1]+' '+prevMo.slice(0,4):'—';
      var siteName = SL[site]||site;

      var sl = prs.addSlide();
      sl.background={color:'ffffff'};

      // Header
      sl.addText('Kawan Lama Group',{x:0.25,y:0.08,w:5,h:0.18,fontSize:7.5,color:'94a3b8'});
      sl.addText('Transport Operations Performance — '+siteName,{x:0.25,y:0.24,w:10,h:0.3,fontSize:13,bold:true,color:CLR_TEXT});
      sl.addText(moLabel+' vs '+prevLabel,{x:0.25,y:0.52,w:10,h:0.22,fontSize:9,color:CLR_GRAY});
      sl.addShape(prs.ShapeType.line,{x:0.25,y:0.77,w:12.83,h:0,line:{color:'e2e8f0',width:0.75}});

      // ── TABLE: rows=METRIC, cols=BU pair (prev | cur | delta) ──
      // Col widths: metric label (1.5) + per BU: prev(1.1) + cur(1.1) + delta(0.7) = 2.9
      // Max BUs: 5 (Jababeka) → 1.5 + 5*2.9 = 16 → too wide for 13.33
      // Use: metric(1.4) + per BU: prev(1.0) + cur(1.0) + delta(0.65) = 2.65
      // 5 BU: 1.4 + 5*2.65 = 14.65 → still wide
      // Limit display: metric(1.3) + BU(prev+cur+delta = 0.85+0.85+0.55=2.25)
      // 5 BU: 1.3+5*2.25=12.55 ✓

      var buW = 2.25; // width per BU group
      var metW = 1.3;
      var totalW = metW + bus.length*buW;
      var x0 = (13.33-totalW)/2;

      // Build header rows
      var hdrRow1 = [hdr('METRIK','2d3748')];
      bus.forEach(function(bu){
        hdrRow1.push({text:bu.label, options:{fontSize:8,fontFace:'Calibri',bold:true,color:'ffffff',fill:{type:'solid',color:CLR_HDR},align:'center',colspan:3}});
        hdrRow1.push(null); hdrRow1.push(null); // colspan placeholders
      });

      var hdrRow2 = [hdr('','2d3748')];
      bus.forEach(function(bu){
        hdrRow2.push(hdr(prevLabel,'374151'));
        hdrRow2.push(hdr(moLabel,'166534'));
        hdrRow2.push(hdr('Δ','64748b'));
      });

      // Build metric rows
      var tableRows = [hdrRow1, hdrRow2];
      METRICS.forEach(function(m) {
        var row = [cell(m.label,true,CLR_TEXT,'left')];
        bus.forEach(function(bu) {
          var cur = getRes(bu.key, mo);
          var prv = prevMo?getRes(bu.key, prevMo):null;
          var curV = cur?cur[m.key]:null;
          var prvV = prv?prv[m.key]:null;
          var d = delta(curV, prvV, m.type, m.hi);
          // Color cur value vs target
          var curColor = CLR_TEXT;
          if(m.tgt && curV!=null) {
            var pct = m.hi ? curV/m.tgt : m.tgt/curV;
            curColor = pct>=1.0?'166534':pct>=0.9?'92400e':'b91c1c';
          }
          row.push(cell(fmtV(prvV,m.type),false,CLR_GRAY));
          row.push({text:fmtV(curV,m.type),options:{fontSize:7.5,fontFace:'Calibri',bold:true,color:curColor,align:'center',valign:'middle'}});
          row.push(deltaCell(d));
        });
        tableRows.push(row);
      });

      // Col widths
      var colW = [metW];
      bus.forEach(function(){colW.push(0.75,0.85,0.65);});

      sl.addTable(tableRows,{
        x:x0, y:0.85, w:totalW,
        colW:colW,
        rowH:0.28,
        fontSize:7.5,
        fontFace:'Calibri',
        border:{type:'solid',pt:0.5,color:'e2e8f0'},
        align:'center',valign:'middle',
        color:CLR_TEXT,
      });

      // Footer
      sl.addText(siteName+' · '+moLabel+' vs '+prevLabel,{x:0.25,y:7.3,w:12.83,h:0.15,fontSize:6.5,color:'cbd5e1'});
    });
  });

  var fname='TOP_'+siteLabel.replace(/\s/g,'_')+'_'+s.slice(0,7)+'_'+e.slice(0,7)+'.pptx';
  prs.writeFile({fileName:fname}).then(function(){
    document.getElementById('pptStatus').textContent='✅ Downloaded: '+fname;
  }).catch(function(err){
    document.getElementById('pptStatus').textContent='❌ Error: '+err.message;
  });
}

</script>
</body>
</html>
