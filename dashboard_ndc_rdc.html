<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDC & RDC — Performance Dashboard</title>
<!-- v2.1 full-month-fix -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --sw: 220px; --bg: #f1f5f9; --white: #fff; --border: #e2e8f0;
  --text: #0f172a; --t2: #475569; --t3: #94a3b8;
  --green: #166534; --gbg: #f0fdf4; --gm: #16a34a; --gl: #86efac;
  --blue: #1d4ed8; --bbg: #eff6ff;
  --red: #b91c1c; --rbg: #fef2f2;
  --orange: #c2410c; --obg: #fff7ed;
  --shadow: 0 1px 3px rgba(0,0,0,.05); --shadow-md: 0 4px 16px rgba(0,0,0,.07);
  --r: 12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:13px;}
.sidebar{width:var(--sw);background:#1e2a3a;border-right:none;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;overflow-y:auto;}
.s-logo{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;}
.s-icon{width:32px;height:32px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0;}
.s-title{font-weight:700;font-size:13px;color:#fff;}.s-sub{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.8px;}
.s-sec{padding:14px 12px 6px;}
.s-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;padding:0 4px;margin-bottom:4px;}
.s-item{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-radius:6px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.65);font-size:12.5px;}
.s-item:hover{background:rgba(255,255,255,.07);}
.s-item.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600;}
.s-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;margin-right:6px;}
.s-dot.ndc{background:#1a73e8;}.s-dot.rdc{background:#e37400;}
.s-badge{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;}
.s-div{height:1px;background:rgba(255,255,255,.1);margin:6px 12px;}
.s-group{overflow:hidden;transition:max-height .25s ease;}
.s-group.collapsed{max-height:0;}
.s-group.expanded{max-height:400px;}
.s-item.parent{justify-content:space-between;}
.s-chevron{font-size:9px;opacity:.5;transition:transform .2s;flex-shrink:0;}
.s-chevron.open{transform:rotate(180deg);}
.s-sub-item{display:flex;align-items:center;padding:5px 8px 5px 22px;border-radius:6px;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.5);font-size:12px;}
.s-sub-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);}
.s-sub-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;}
.s-sub-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);flex-shrink:0;margin-right:7px;}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;gap:10px;flex-wrap:wrap;}
.topbar h2{font-size:15px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn-tog{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.btn-tog button{padding:5px 12px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:var(--white);color:var(--t2);font-family:'Inter',sans-serif;transition:all .15s;}
.btn-tog button.active{background:var(--green);color:#fff;}
.ctrl-lbl{font-size:11px;color:var(--t3);}
.date-in{border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;color:var(--text);background:var(--white);outline:none;cursor:pointer;}
.date-in:focus{border-color:var(--green);}
.btn-apply{background:var(--green);color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-apply:hover{background:var(--gm);}
.btn-fm{background:var(--bg);color:var(--t2);border:1.5px solid var(--border);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;letter-spacing:.4px;}
.btn-fm:hover{border-color:var(--green);color:var(--green);}
.btn-fm.active{background:var(--green);color:#fff;border-color:var(--green);}
.s-filter{background:var(--gbg);border:1px solid var(--gl);color:var(--green);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;outline:none;}
.upd-info{font-size:11px;color:var(--t3);}
.upd-info span{color:var(--t2);font-weight:500;}
.btn-ref{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--white);font-size:12px;color:var(--t2);cursor:pointer;font-family:'Inter',sans-serif;}
.btn-ref:hover{background:var(--bg);}
.btn-ref svg{width:13px;height:13px;}
.content{padding:20px 24px;flex:1;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--t3);}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);transition:box-shadow .2s;}
.kpi:hover{box-shadow:var(--shadow-md);}
.kpi .lbl{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.kpi .val{font-size:21px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;line-height:1;}
.kpi .val.green{color:var(--green);}.kpi .val.red{color:var(--red);}.kpi .val.blue{color:var(--blue);}
.kpi .sub{font-size:10px;color:var(--t3);margin-top:4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:1200px){.g3{grid-template-columns:1fr 1fr;}.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.ph{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ph h3{font-size:13px;font-weight:600;}
.ph .tag{font-size:10px;color:var(--t3);background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:10px;}
.pb{padding:14px 16px;}
.tw{overflow-x:auto;}
.dt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;}
.dt thead th{padding:8px 11px;text-align:right;font-weight:600;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--border);white-space:nowrap;background:var(--bg);}
.dt thead th:first-child{text-align:left;}
.dt tbody td{padding:7px 11px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;}
.dt tbody tr:last-child td{border-bottom:none;}
.dt tbody tr.sum{background:var(--gbg);font-weight:600;}
.dt tbody tr.sum td{color:var(--green);border-top:2px solid var(--gl);border-bottom:none;}
.dt tbody tr:not(.sum):hover td{background:var(--bg);}
.num{text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.bg{background:var(--gbg);color:var(--green);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
.bm{background:var(--obg);color:var(--orange);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
.br{background:var(--rbg);color:var(--red);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
.bars{display:flex;flex-direction:column;gap:9px;}
.bi .bh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bi .bs{font-weight:500;}.bi .bv{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px;}
.bt{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.bf{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.bf.g{background:linear-gradient(90deg,var(--gl),var(--green));}
.bf.b{background:linear-gradient(90deg,#93c4fd,var(--blue));}
.bf.o{background:linear-gradient(90deg,#fcd980,var(--orange));}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:900px){.metric-grid{grid-template-columns:1fr;}}
.trend-table .dt thead th{background:var(--white);}
.delta-up{color:var(--gm);font-weight:600;font-size:11px;}
.delta-dn{color:var(--red);font-weight:600;font-size:11px;}
.delta-nt{color:var(--t3);font-size:11px;}
canvas{display:block;}

/* ── Export / Screenshot View ── */
body.export-mode .sidebar { display:none !important; }
body.export-mode .main { margin-left:0 !important; }
body.export-mode .topbar { display:none !important; }
body.export-mode .content { padding:16px 24px; background:#f1f5f9; }
body.export-mode .panel { border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
body.export-mode #btnExport { display:none; }
/* Exit export mode button */
#exitExport {
  display:none; position:fixed; top:12px; right:16px; z-index:999;
  background:#166534; color:#fff; border:none; padding:7px 14px;
  border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif; box-shadow:0 2px 8px rgba(0,0,0,.2);
}
body.export-mode #exitExport { display:block; }
/* ── Premium MTT Table ── */
.mtt{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;}
.mtt thead tr{background:#f8fafb;}
.mtt th{color:#64748b;font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;padding:10px 14px;border-bottom:2px solid #e2e8f0;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:1;}
.mtt th:first-child,.mtt th:nth-child(2){text-align:left;}
.mtt tbody tr{transition:background .12s;}
.mtt tbody tr:hover{background:#f8fffe;}
.mtt tbody tr:nth-child(even){background:#fafcfb;}
.mtt tbody tr:nth-child(odd){background:#ffffff;}
.mtt td{padding:9px 14px;border-bottom:1px solid #f1f5f2;text-align:center;white-space:nowrap;}
.mtt td:first-child{text-align:left;font-weight:700;color:#1e293b;font-size:11px;border-left:3px solid transparent;}
.mtt td:nth-child(2){text-align:left;color:var(--t2);font-size:11px;}
.mtt tr:last-child td{border-bottom:none;}
.mtt tr.sum-row td{background:#f0faf5;font-weight:700;border-top:2px solid #86efac;color:#166534;}
.mtt .c-red{background:#fef2f2;color:#b91c1c;font-weight:700;}
.mtt .c-yel{background:#fffbeb;color:#92400e;font-weight:700;}
.mtt .c-grn{background:#f0fdf4;color:#166534;font-weight:700;}
.mtt .c-def{color:var(--text);}
.mtt .pct{font-size:9px;opacity:.60;font-weight:400;display:block;margin-top:1px;}
/* Row accent by site type */
.mtt tbody tr[data-site-type="ndc"] td:first-child{border-left-color:#3b82f6;}
.mtt tbody tr[data-site-type="rdc"] td:first-child{border-left-color:#f97316;}

/* ── Panel premium — screenshot-ready ── */
.panel{background:#ffffff;border:1px solid #e8eef2;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);}
.ph{padding:16px 20px 13px;border-bottom:1px solid #f1f5f2;display:flex;align-items:center;justify-content:space-between;}
.ph h3{font-size:14px;font-weight:700;color:#0f172a;letter-spacing:-.3px;}
.ph .tag{font-size:10px;color:#94a3b8;background:#f8fafc;border:1px solid #e2e8f0;padding:3px 10px;border-radius:20px;font-weight:500;letter-spacing:.2px;}

/* ── Trendline chart panel ── */
#dTREND{border-radius:0;}
.trend-chart-wrap{padding:20px 20px 12px;background:#fff;}

/* ── Screenshot helper: clean content area ── */
.content{padding:20px 24px;flex:1;background:#f1f5f9;}

/* ── Trend table section header ── */
.mtt-section-header{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;}
.mtt-section-header h4{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.5px;}
.mtt-section-divider{flex:1;height:1px;background:#e2e8f0;}

/* ── Trendline legend dots ── */
.legend-strip{display:flex;flex-wrap:wrap;gap:14px;padding:10px 20px 14px;border-top:1px solid #f1f5f2;}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#64748b;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── Utilisasi color cells ── */
.mtt .c-grn{background:#f0fdf4;color:#166534;font-weight:700;}
.mtt .c-yel{background:#fffbeb;color:#92400e;font-weight:700;}
.mtt .c-red{background:#fef2f2;color:#b91c1c;font-weight:700;}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.cmp-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;}
.cmp-ctrl label{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.cmp-period{display:flex;align-items:center;gap:6px;}
.cmp-dot-a{width:8px;height:8px;border-radius:50%;background:#1a73e8;flex-shrink:0;}
.cmp-dot-b{width:8px;height:8px;border-radius:50%;background:#e37400;flex-shrink:0;}
.cmp-sep{color:var(--t3);font-size:11px;}
.btn-cmp{background:var(--green);color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-cmp:hover{background:var(--gm);}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.ach-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);}
.ach-card .ac-lbl{font-size:9px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.ach-card .ac-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1;}
.ach-card .ac-tgt{font-size:10px;color:var(--t3);margin-top:3px;}
.ach-card .ac-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;margin-top:5px;letter-spacing:.3px;}
.ac-badge.hit{background:var(--gbg);color:var(--green);}
.ac-badge.warn{background:#fff8e6;color:#b06000;}
.ac-badge.miss{background:var(--rbg);color:var(--red);}
.d-up{color:var(--gm);font-weight:600;font-size:11px;}
.d-dn{color:var(--red);font-weight:600;font-size:11px;}
.d-nt{color:var(--t3);font-size:11px;}
.arrow-up::before{content:'▲ ';}
.arrow-dn::before{content:'▼ ';}
.ins-tbl{table-layout:fixed;}
.ins-tbl thead th{background:var(--bg);}
.ins-tbl .col-a{color:#1a73e8;font-weight:600;}
.ins-tbl .col-b{color:#e37400;font-weight:600;}
.ins-tbl .gap-pos{color:var(--gm);font-weight:600;}
.ins-tbl .gap-neg{color:var(--red);font-weight:600;}
.kesimpulan{border-radius:var(--r);padding:14px 16px;margin-top:14px;}
.kesimpulan.baik{background:var(--gbg);border:1px solid var(--gl);}
.kesimpulan.evaluasi{background:#fff8e6;border:1px solid #f9c825;}
.kesimpulan h4{font-size:12px;font-weight:700;margin-bottom:8px;}
.kesimpulan ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
.kesimpulan ul li{font-size:11px;color:var(--t2);}
.kesimpulan ul li::before{margin-right:6px;}
.kesimpulan.baik h4{color:var(--green);}
.kesimpulan.evaluasi h4{color:#b06000;}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:7px;padding:3px;margin-bottom:16px;width:fit-content;}
.tab{padding:6px 16px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;color:var(--t2);transition:all .15s;}
.tab.active{background:var(--white);color:var(--green);font-weight:600;box-shadow:var(--shadow);}
</style>
</head>

<aside class="sidebar">
  <div class="s-logo">
    <div class="s-icon">NR</div>
    <div><div class="s-title">NDC & RDC</div><div class="s-sub">Performance</div></div>
  </div>
  <div class="s-sec">
    <div class="s-lbl">Menu</div>
    <div class="s-item active" id="nav-overview" onclick="setNav('overview')">📊 Overview</div>
    <div class="s-item" id="nav-detail" onclick="setNav('detail')">📋 Detail Metrik</div>
    <div class="s-item" id="nav-slide" onclick="setNav('slide')">🖼️ Slide</div>
  </div>
  <div class="s-div"></div>
  <div class="s-sec">
    <div class="s-lbl">Filter Site</div>
    <div class="s-item" id="site-ALL" onclick="setSite('ALL')"><span>Semua Site</span><span class="s-badge">5</span></div>
    <div class="s-item" id="site-NDC_RDC" onclick="setSite('NDC_RDC')"><span>NDC & RDC</span><span class="s-badge">5</span></div>
    <div class="s-item" id="site-NDC" onclick="setSite('NDC')"><span>NDC</span><span class="s-badge">3</span></div>
    <div class="s-item" id="site-RDC" onclick="setSite('RDC')"><span>RDC</span><span class="s-badge">2</span></div>
  </div>
  <div class="s-sec">
    <div class="s-lbl">NDC</div>
    <div class="s-item parent" id="site-JABABEKA" onclick="handleSiteClick('JABABEKA','grp-jab',event)">
      <span style="display:flex;align-items:center;gap:0"><span class="s-dot ndc"></span>Jababeka</span>
      <span class="s-chevron" id="chv-grp-jab">▼</span>
    </div>
    <div class="s-group collapsed" id="grp-jab">
      <div class="s-sub-item" id="site-JAB_HCI" onclick="setSite('JAB_HCI')"><span class="s-sub-dot"></span>HCI</div>

<script>
function toggleExportView() {
  document.body.classList.toggle('export-mode');
  // Resize charts after layout change
  setTimeout(function() {
    Object.values(charts).forEach(function(c) { if(c && c.resize) c.resize(); });
  }, 100);

// ── STATE ──────────────────────────────────────────────────────
let ROWS = [];
let UTIL_ROWS = []; // utilisasi data from data_utilisasi.json
let currentNav  = 'overview';
let currentSite = 'ALL';
let fullMonthMode = false;

function toggleFM() {
  fullMonthMode = !fullMonthMode;
  document.getElementById('btnFM').classList.toggle('active', fullMonthMode);
  render();
}
let charts = {};
const SL = {
  JABABEKA:'Jababeka', CIKUPA:'Cikupa', SDA:'Sidoarjo', TALLO:'Tallo', TAMORA:'Tamora',
  NDC:'NDC', RDC:'RDC', NDC_RDC:'NDC & RDC',
  JAB_HCI:'JAB - HCI', JAB_AHI:'JAB - AHI', JAB_FBI:'JAB - FBI', JAB_KLS:'JAB - KLS',
  SDA_HCI:'SDA - HCI', SDA_AHI:'SDA - AHI', SDA_FBI:'SDA - FBI',
  NDC:'NDC', RDC:'RDC', NDC_RDC:'NDC & RDC',
};
const SITES = ['JABABEKA','CIKUPA','SDA','TALLO','TAMORA'];
const SITES_NDC = ['JABABEKA','CIKUPA','SDA'];
const SITES_RDC = ['TALLO','TAMORA'];
const SITE_GROUPS = {
  NDC: ['JABABEKA','CIKUPA','SDA'],
  RDC: ['TALLO','TAMORA'],
};
const SUB_SITES = {
  JAB_HCI: { baseSite:'JABABEKA', owners:['HCI'] },
  JAB_AHI: { baseSite:'JABABEKA', owners:['AHI','NKA','TGI'] },
  JAB_FBI: { baseSite:'JABABEKA', owners:['FBI'] },
  JAB_KLS: { baseSite:'JABABEKA', owners:['KLS'] },
  SDA_HCI: { baseSite:'SDA',      owners:['HCI'] },
  SDA_AHI: { baseSite:'SDA',      owners:['AHI','TGI'] },
  SDA_FBI: { baseSite:'SDA',      owners:['FBI'] },
};
const TARGETS = {
  olf:      { label:'OLF', target: 0.85,  dir:'up',   fmt: v=>v!=null?(v*100).toFixed(1)+'%':'—', tgtFmt:'85%' },
  ritase:   { label:'Ritase', targetBySite:{ JABABEKA:1.15, CIKUPA:1.05, SDA:1.07, TALLO:1.25, TAMORA:1.25, NATIONAL:1.15 }, targetNational:1.15, dir:'up', fmt: v=>v!=null?v.toFixed(2):'—', tgtFmt:'site-specific' },
  dpMix:    { label:'DP Mix', target: 8.0, dir:'up', fmt: v=>v!=null?v.toFixed(1):'—', tgtFmt:'8.0' },
  dpReg:    { label:'DP Reg', target: 8.0, dir:'up', fmt: v=>v!=null?v.toFixed(1):'—', tgtFmt:'8.0' },
  doTrip:   { label:'DO/Trip (Regular)', target: 11.0, dir:'up', fmt: v=>v!=null?v.toFixed(1):'—', tgtFmt:'11.0' },
};
let cmpA = { start:'', end:'' };
let cmpB = { start:'', end:'' };

if(typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);

function buildMonthlyFromRows(rows) {
  var result = [];
  var months = [...new Set(rows.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();
  months.forEach(function(mo) {
    SITES.forEach(function(site) {
      var moRows = rows.filter(r=>r.site===site&&r.date&&r.date.slice(0,7)===mo);
      if(!moRows.length) return;
      var res = computeSite(moRows, site)||{};
      result.push({site:site, label:SL[site], month:mo,
        ritase:res.ritase, olf:res.olf, dpStore:res.dpStore, dpMix:res.dpMix,
        dpNonReg:res.dpNonReg, dpReg:res.dpReg, doTrip:res.doTrip, doDp:res.doDp,
        cbmDo:res.cbmDo, cbmDp:res.cbmDp, tatDirect:res.tatDirect, tatStore:res.tatStore});
    });
  });
  return result;
}

let MONTHLY = [];
let RAW_LOADED = false;

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><p id="loadMsg">Memuat data...</p></div>';
  try {
    let usedMonthly = false;
    try {
      const mRes = await fetch('data_monthly.json?t=' + Date.now());
      if(mRes.ok) {
        const mJson = await mRes.json();
        MONTHLY = mJson.monthly || [];
        document.getElementById('updTime').textContent = mJson.timestamp || '14 May 2026 18:30 WIB';
        usedMonthly = true;
      }
    } catch(e2) {}
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('data.json not found. Pastikan GitHub Actions sudah dijalankan.');
    const json = await res.json();
    ROWS = json.rows || [];
    RAW_LOADED = true;
    // Also try to load utilisasi data
    try {
      const uRes = await fetch('data_utilisasi.json?t=' + Date.now());
      if(uRes.ok) { const uJson = await uRes.json(); UTIL_ROWS = uJson.rows || []; }
    } catch(e3) { UTIL_ROWS = []; }
    if(!usedMonthly) {
      document.getElementById('updTime').textContent = json.timestamp || '14 May 2026 18:30 WIB';
      MONTHLY = buildMonthlyFromRows(ROWS);
    } else {
      document.getElementById('updTime').textContent = json.timestamp || document.getElementById('updTime').textContent;
    }
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading"><p style="color:var(--red)">⚠ '+e.message+'</p></div>';
  }
}

function getRange() {
  const s = document.getElementById('startDate').value;
  const e = document.getElementById('endDate').value;
  return { start: s, end: e };
}

// Returns {start, end} for a given month string 'YYYY-MM'
// In FM mode: full month. In range mode: clamp to filter day range.
function getMonthRange(mo) {
  var {start: fs, end: fe} = getRange();
  var year = parseInt(mo.slice(0,4)), month = parseInt(mo.slice(5,7));
  var lastDay = new Date(year, month, 0).getDate();
  if(fullMonthMode) {
    return { start: mo+'-01', end: mo+'-'+String(lastDay).padStart(2,'0') };
  } else {
    var d1 = Math.min(parseInt(fs.slice(8,10)), lastDay);
    var d2 = Math.min(parseInt(fe.slice(8,10)), lastDay);
    return { start: mo+'-'+String(d1).padStart(2,'0'), end: mo+'-'+String(d2).padStart(2,'0') };
  }
}

function filterRows(rows, start, end, site) {
  const sub = SUB_SITES[site];
  return rows.filter(r => {
    if (!r.date) return false;
    if (r.date < start || r.date > end) return false;
    if (sub) {
      if (r.site !== sub.baseSite) return false;
      return sub.owners.some(o => (r.owner||'').toUpperCase() === o.toUpperCase());
    }
    if (site === 'ALL' || site === 'NDC_RDC') return true;
    if (site === 'NDC') return SITES_NDC.includes(r.site);
    if (site === 'RDC') return SITES_RDC.includes(r.site);
    if (site === 'JABABEKA') return r.site === 'JABABEKA';
    return r.site === site;
  });
}

function avg(a) { a=a.filter(x=>x!=null&&!isNaN(x)); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null; }
function ssum(a){ return a.filter(x=>x!=null&&!isNaN(x)).reduce((s,x)=>s+x,0); }
function pf(v,d=2){ return v==null?'—':v.toFixed(d); }
function pp(v){ return v==null?'—':(v*100).toFixed(1)+'%'; }
function parseTAT(s){
  if(!s||s==='—')return null;
  s=s.toString().trim();
  const m=s.match(/^(-?\d+):(\d{2})(?::(\d{2}))?$/);
  if(m) return +m[1]+parseInt(m[2])/60+(m[3]?parseInt(m[3]):0)/3600;
  const n=parseFloat(s); if(!isNaN(n)&&n>0&&n<2)return n*24;
  return null;
}
function tatStr(h){
  if(h==null||isNaN(h))return'—';
  const t=Math.round(Math.abs(h)*3600);
  return `${Math.floor(t/3600)}:${String(Math.floor(t%3600/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

function computeSite(rows, site) {
  const sub = SUB_SITES[site];
  const effectiveSite = sub ? sub.baseSite : site;
  const isJAB = effectiveSite === 'JABABEKA';
  const isCIK = effectiveSite === 'CIKUPA';
  const isSDA = effectiveSite === 'SDA';
  const isSub = !!sub;
  const isKLS = site === 'JAB_KLS';
  const isFBI = site === 'JAB_FBI';
  const sr = rows.filter(r => r.site === effectiveSite);

  // Nopol lists for FBI/KLS ritase calculation
  const FBI_NOPOL_SET = new Set(['A8012ZV','A8607WX','A8386VX','A8976XA','B9015SCF','B9018SCF','A8157ZC','A8232ZC','B9747SCE','A8710ZE','A8711ZE','A8709ZE','A8541ZE','A8506ZD','A8088VC']);
  const KLS_NOPOL_SET = new Set(['A8437ZH','A8481ZH','A8801XZ','A8537ZF','A8721VB','A8717VB','A8757VB','A8759VB','A8912VB','A8910VB','A8020VC','A8542XB','A8237VD','B9044BRO','B9068BEN','A8876ZX','A8002XW','A8503ZX','A8048ZX','A8288YX','A8976XY','A8908XY','B9190SDB','B9642SCE','A8098ZH','A8504ZX','A8339ZS','A8432ZS','A8159ZC','B9320SCE','A8721ZV','A8553VB','A8961VB','A8983VB','A8017VC','A8373VC','A8304VC','A8476VC','A8486VC','A8505VC','A8520VC']);

  const ritRows = sr.filter(r => {
    if(r.td === 'satelite') return false;
    if(isCIK && (r.ja||'').toUpperCase() === 'MIN VAN OPS') return false;
    if(isFBI) return FBI_NOPOL_SET.has((r.nopol||'').toUpperCase());
    if(isKLS) return KLS_NOPOL_SET.has((r.nopol||'').toUpperCase());
    // JAB_HCI: nopol di HCI sheet, exclude FBI & KLS
    if(site === 'JAB_HCI') {
      if(FBI_NOPOL_SET.has((r.nopol||'').toUpperCase())) return false;
      if(KLS_NOPOL_SET.has((r.nopol||'').toUpperCase())) return false;
      return r.sheet === 'HCI JABABEKA';
    }
    // JAB_AHI: nopol di AHI sheet, exclude FBI & KLS
    if(site === 'JAB_AHI') {
      if(FBI_NOPOL_SET.has((r.nopol||'').toUpperCase())) return false;
      if(KLS_NOPOL_SET.has((r.nopol||'').toUpperCase())) return false;
      return r.sheet === 'AHI JABABEKA';
    }
    // Corporate JABABEKA: semua BU (HCI+AHI+FBI+KLS), cross-BU OK
    if(isJAB && !isSub) return true;
    return true;
  });
  const byDate = {};
  ritRows.forEach(r => {
    if(!byDate[r.date]) byDate[r.date]={trips:new Set(),nopols:new Set()};
    byDate[r.date].trips.add(r.lc);
    if(r.nopol) byDate[r.date].nopols.add(r.nopol);
  });
  // Ritase = total LC unik / total nopol-hari aktif (total to total)
  const ritTotalLC     = new Set(ritRows.map(r=>r.lc).filter(Boolean)).size;
  const ritTotalNopol  = Object.values(byDate).reduce(function(s,v){return s+v.nopols.size;},0);
  const ritaseVal      = ritTotalNopol > 0 ? ritTotalLC / ritTotalNopol : null;

  // srMain: corporate Jababeka include semua BU (HCI+AHI+FBI+KLS)
  const srMain = (isJAB && !isSub && !isKLS) ? sr : (isJAB && isKLS) ? sr.filter(r => r.sheet === 'KLS JABABEKA') : sr;
  const olfR = srMain.filter(r => {
    if(r.td !== 'store') return false;
    if(isJAB && r.sheet === 'KLS JABABEKA') return false; // KLS B2B, no OLF
    if(!isSub && isJAB && r.sheet === 'AHI JABABEKA' && r.owner === 'FBI') return false;
    if(isJAB && r.kat !== 'REGULAR') return false;
    if(isCIK && !(r.od||'').includes('non cikande')) return false;
    if(!isSub && isSDA && (r.owner === 'FBI' || r.kat !== 'REGULAR')) return false;
    if(isSub && isSDA && r.kat !== 'REGULAR') return false;
    return true;
  });
  const oL = ssum(olfR.map(r=>parseFloat(r.cbm)||0));
  const oM = ssum(olfR.map(r=>parseFloat(r.cap)||0));

  // DP Store — sum(DP) / countUnique(LC) total to total
  const olfLcSet = new Set(olfR.map(r=>r.lc).filter(Boolean));
  const dpStSum  = ssum(olfR.map(r=>parseFloat(r.dp)||0));
  const dpStLC   = olfLcSet.size;

  // DP Mix — all customer rows, total to total
  const dpMxRows = srMain.filter(r => r.td==='customer');
  const dpMxSum  = ssum(dpMxRows.map(r=>parseFloat(r.dp)||0));
  const dpMxLC   = new Set(dpMxRows.map(r=>r.lc).filter(Boolean)).size;

  // DP Non Reg — customer NON REGULAR, total to total
  const dpNRRows = srMain.filter(r => r.td==='customer' && r.kat==='NON REGULAR');
  const dpNRSum  = ssum(dpNRRows.map(r=>parseFloat(r.dp)||0));
  const dpNRLC   = new Set(dpNRRows.map(r=>r.lc).filter(Boolean)).size;

  // DP Reg / DO Trip Regular — customer REGULAR, total to total
  const drR = srMain.filter(r => {
    if(r.td !== 'customer') return false;
    if(r.ta === 'PICKUP') return false;
    if(r.kat !== 'REGULAR') return false;
    if(!isSub && isJAB && r.owner === 'FBI') return false;
    if(!isSub && isSDA && r.owner === 'FBI') return false;
    if(isCIK && !(r.sat||'').includes('NON SATELIT')) return false;
    return true;
  });
  const doDpK    = ssum(drR.map(r=>parseFloat(r.do)||0));
  const doDpN    = ssum(drR.map(r=>parseFloat(r.dp)||0));
  const drRLC    = new Set(drR.map(r=>r.lc).filter(Boolean)).size;
  const cbmTotal = ssum(drR.map(r=>parseFloat(r.cbm)||0));

  const tatD = srMain.filter(r => {
    if(r.td !== 'customer' || r.kat !== 'REGULAR') return false;
    if(isCIK) return (r.sat||'').includes('NON SATELIT');
    return r.sa.includes('DALAM KOTA');
  }).map(r=>parseTAT(r.tat)).filter(t=>t!=null&&t>=0&&t<=24);
  const tatS = srMain.filter(r => {
    if(r.td !== 'store' || r.kat !== 'REGULAR') return false;
    if(isCIK) return (r.sat||'').includes('NON SATELIT');
    return r.sa.includes('DALAM KOTA');
  }).map(r=>parseTAT(r.tat)).filter(t=>t!=null&&t>=0&&t<=(isCIK?12:24));
  const totalCbmStore = ssum(olfR.map(r=>parseFloat(r.cbm)||0));

  // DO/Trip Mix = total DO customer / countUnique(LC customer) — total to total
  const allTripRows = srMain.filter(r => r.td === 'customer');
  const allDoSum    = ssum(allTripRows.map(r=>parseFloat(r.do)||0));
  const allLcCount  = new Set(allTripRows.map(r=>r.lc).filter(Boolean)).size;
  const doTripAll   = allLcCount>0 ? allDoSum/allLcCount : null;

  // totalDoCust & totalDpCust
  const drAll      = srMain.filter(r => r.td==='customer');
  const totalDoCust = ssum(drAll.map(r=>parseFloat(r.do)||0));
  const totalDpCust = ssum(drAll.map(r=>parseFloat(r.dp)||0));

  return {
    site, label: SL[site]||site,
    ritase: ritaseVal, olf: (isKLS||isFBI) ? null : (oM>0?oL/oM:null),
    dpStore:   dpStLC>0  ? dpStSum/dpStLC   : null,
    dpMix:     dpMxLC>0  ? dpMxSum/dpMxLC   : null,
    dpNonReg:  dpNRLC>0  ? dpNRSum/dpNRLC   : null,
    dpReg:     drRLC>0   ? doDpN/drRLC      : null,
    doTrip:    drRLC>0   ? doDpK/drRLC      : null,
    doDp:      doDpN>0   ? doDpK/doDpN      : null,
    cbmDo:     doDpK>0   ? cbmTotal/doDpK   : null,
    cbmDp:     doDpN>0   ? cbmTotal/doDpN   : null,
    tatDirect: avg(tatD), tatStore: avg(tatS),
    totalCbmStore, totalDoCust, totalDpCust,
    doTripAll,
    rowCount: sr.length,
  };
}

function computeAll(rows) { return SITES.map(s => computeSite(rows, s)).filter(Boolean); }
function makeSummary(results) {
  const keys = ['ritase','olf','dpStore','dpMix','dpNonReg','dpReg','doTrip','doDp','cbmDo','cbmDp','tatDirect','tatStore','doTripAll'];
  const sumKeys = ['totalCbmStore','totalDoCust','totalDpCust'];
  return {
    site:'NDC & RDC', label:'NDC & RDC',
    ...Object.fromEntries(keys.map(k=>[k,avg(results.map(r=>r[k]))])),
    ...Object.fromEntries(sumKeys.map(k=>[k,ssum(results.map(r=>r[k]||0))])),
  };
}

function applyFilter() { render(); }
function onSiteChange() { currentSite = document.getElementById('siteSelect').value; updateSidebarActive(); render(); }

function handleSiteClick(site, grpId, e) {
  const grp = document.getElementById(grpId);
  const chv = document.getElementById('chv-'+grpId);
  if(grp) {
    const isExpanded = grp.classList.contains('expanded');
    grp.classList.toggle('expanded', !isExpanded);
    grp.classList.toggle('collapsed', isExpanded);
    if(chv) chv.classList.toggle('open', !isExpanded);
  }
  setSite(site);
}

function setSite(s) {
  currentSite = s;
  document.getElementById('siteSelect').value = s;
  if(SUB_SITES[s]) {
    const baseSite = SUB_SITES[s].baseSite;
    const grpId = baseSite === 'JABABEKA' ? 'grp-jab' : 'grp-sda';
    const grp = document.getElementById(grpId);
    const chv = document.getElementById('chv-'+grpId);
    if(grp) { grp.classList.add('expanded'); grp.classList.remove('collapsed'); }
    if(chv) chv.classList.add('open');
  }
  updateSidebarActive();
  render();
}

function updateSidebarActive() {
  document.querySelectorAll('.s-item, .s-sub-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('site-'+currentSite);
  if(el) el.classList.add('active');
}

function setNav(n) {
  currentNav = n;
  document.querySelectorAll('.s-item[id^=nav]').forEach(el=>el.classList.remove('active'));
  document.getElementById('nav-'+n)?.classList.add('active');
  render();
}

function render() {
  const {start,end} = getRange();
  const filtered = filterRows(ROWS, start, end, currentSite);
  const results = currentSite === 'ALL' ? computeAll(filtered) :
    currentSite === 'NDC_RDC' ? [makeSummary(computeAll(filtered))].map(r=>({...r, site:'NDC_RDC', label:'NDC & RDC'})) :
    currentSite === 'NDC' ? [makeSummary(SITES_NDC.map(s=>computeSite(filterRows(ROWS,start,end,s),s)).filter(Boolean))].map(r=>({...r,site:'NDC',label:'NDC'})) :
    currentSite === 'RDC' ? [makeSummary(SITES_RDC.map(s=>computeSite(filterRows(ROWS,start,end,s),s)).filter(Boolean))].map(r=>({...r,site:'RDC',label:'RDC'})) :
    [computeSite(filtered, currentSite)];
  const summary = makeSummary(results);
  const d1 = new Date(start).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  const d2 = new Date(end).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('topTitle').textContent = `${currentNav==='overview'?'Overview':'Detail Metrik'} — ${d1} s/d ${d2}`;
  Object.values(charts).forEach(c=>{ try{c.destroy()}catch(e){} });
  charts = {};
  if(currentNav === 'overview') renderOverview(results, summary, start, end);
  else if(currentNav === 'slide') renderSlide(results, summary, start, end);
  else renderDetail(results, summary, start, end);
}
</script>

<script>
// ── OVERVIEW ───────────────────────────────────────────────────
function renderOverview(results, summary, start, end) {

  const kpis = [
    {l:'RITASE',v:pf(summary.ritase),s:'Avg NDC & RDC',c:''},
    {l:'OLF STORE',v:pp(summary.olf),s:'Avg NDC & RDC',c:'green'},
    {l:'OLF TERBAIK',v:pp(best.olf),s:best.label||'—',c:'green'},
    {l:'OLF RENDAH',v:pp(worst.olf),s:worst.label||'—',c:'red'},

  ];
  document.getElementById('content').innerHTML = `
    <div class="kpi-row">${kpis.map(k=>`<div class="kpi"><div class="lbl">${k.l}</div><div class="val ${k.c}">${k.v}</div><div class="sub">${k.s}</div></div>`).join('')}</div>
    <div class="g3">
      <div class="panel"><div class="ph"><h3>OLF Store</h3><span class="tag">% utilitas</span></div><div class="pb"><div class="bars" id="bOLF"></div></div></div>
      <div class="panel"><div class="ph"><h3>DO / Trip Direct</h3><span class="tag">avg</span></div><div class="pb"><div class="bars" id="bDOT"></div></div></div>
      <div class="panel"><div class="ph"><h3>Ritase</h3><span class="tag">avg harian</span></div><div class="pb"><div class="bars" id="bRIT"></div></div></div>
    </div>
    <div class="g2">
      <div class="panel"><div class="ph"><h3>Drop Point Comparison</h3><span class="tag">avg / trip</span></div><div class="pb"><canvas id="cDP"></canvas></div></div>
      <div class="panel"><div class="ph"><h3>TAT Comparison</h3><span class="tag">jam</span></div><div class="pb"><canvas id="cTAT"></canvas></div></div>
    </div>
    <div class="panel"><div class="ph"><h3>Tabel Detail Per Site</h3><span class="tag">${results.length} site</span></div>
      <div class="tw"><table class="dt"><thead><tr>
        <th style="text-align:left;min-width:90px">SITE</th>
        <th class="num" style="min-width:70px">RITASE</th>
        <th class="num" style="min-width:80px">OLF STORE</th>
        <th class="num" style="min-width:75px">DP STORE</th>
        <th class="num" style="min-width:70px">DP MIX</th>
        <th class="num" style="min-width:90px">DP NON REG</th>
        <th class="num" style="min-width:70px">DP REG</th>
        <th class="num" style="min-width:75px">DO/TRIP</th>
        <th class="num" style="min-width:65px">DO/DP</th>
        <th class="num" style="min-width:95px">TAT DIRECT</th>
        <th class="num" style="min-width:90px">TAT STORE</th>

  renderBars('bOLF', results, r=>r.olf!=null?r.olf*100:null, v=>v!=null?v.toFixed(1)+'%':'—', 'g');
  renderBars('bDOT', results, r=>r.doTrip, v=>pf(v,1), 'b');
  renderBars('bRIT', results, r=>r.ritase, v=>pf(v,2), 'o');
  const labs = results.map(r=>r.label);
  const co = {
    responsive:true,
    plugins:{
      legend:{labels:{color:'#5f6368',font:{family:'Inter',size:10},boxWidth:10}},
      tooltip:{backgroundColor:'#fff',borderColor:'#e8eaed',borderWidth:1,titleColor:'#1a1d23',bodyColor:'#5f6368'},
      datalabels:{anchor:'end',align:'top',color:'#1a1d23',font:{family:'Inter',size:9,weight:'600'},formatter:(v)=>v!=null?v.toFixed(1):'',padding:2}
    },
    scales:{
      x:{ticks:{color:'#9aa0a6',font:{family:'Inter',size:10}},grid:{color:'#f5f6fa'}},

  charts.dp = new Chart(document.getElementById('cDP').getContext('2d'),{type:'bar',data:{labels:labs,datasets:[
    {label:'DP Store',data:results.map(r=>r.dpStore),backgroundColor:'rgba(52,168,90,.7)',borderColor:'#34a85a',borderWidth:1,borderRadius:4},
    {label:'DP Mix',data:results.map(r=>r.dpMix),backgroundColor:'rgba(26,115,232,.6)',borderColor:'#1a73e8',borderWidth:1,borderRadius:4},
    {label:'DP Reg',data:results.map(r=>r.dpReg),backgroundColor:'rgba(227,116,0,.5)',borderColor:'#e37400',borderWidth:1,borderRadius:4},

  charts.tat = new Chart(document.getElementById('cTAT').getContext('2d'),{type:'bar',data:{labels:labs,datasets:[
    {label:'TAT Direct (jam)',data:results.map(r=>r.tatDirect!=null?+r.tatDirect.toFixed(2):null),backgroundColor:'rgba(52,168,90,.7)',borderColor:'#34a85a',borderWidth:1,borderRadius:4},
    {label:'TAT Store (jam)',data:results.map(r=>r.tatStore!=null?+r.tatStore.toFixed(2):null),backgroundColor:'rgba(26,115,232,.6)',borderColor:'#1a73e8',borderWidth:1,borderRadius:4},

  const allRows = [...results, {...summary, isSummary:true}];
  document.getElementById('tBody').innerHTML = allRows.map(r=>`
    <tr class="${r.isSummary?'sum':''}">
      <td><strong>${r.label||r.site}</strong></td>

      <td class="num">${pf(r.dpStore,1)}</td><td class="num">${pf(r.dpMix,1)}</td>
      <td class="num">${pf(r.dpNonReg,1)}</td><td class="num">${pf(r.dpReg,1)}</td>
      <td class="num">${pf(r.doTrip,1)}</td><td class="num">${pf(r.doDp,2)}</td>

}

function olfBadge(v) {
  if(v==null)return'—';
  const p=v*100;
  if(p>=90)return`<span class="bg">${p.toFixed(1)}%</span>`;
  if(p>=80)return`<span class="bm">${p.toFixed(1)}%</span>`;
  return`<span class="br">${p.toFixed(1)}%</span>`;
}

function renderBars(id, results, getFn, fmtFn, cls) {
  const vals = results.map(r=>getFn(r)||0);
  const max = Math.max(...vals);
  document.getElementById(id).innerHTML = results.map((r,i)=>`
    <div class="bi">
      <div class="bh"><span class="bs">${r.label}</span><span class="bv">${fmtFn(getFn(r))}</span></div>
      <div class="bt"><div class="bf ${cls}" style="width:${max>0?(vals[i]/max*100).toFixed(1):0}%"></div></div>
    </div>`).join('');
}

function getTarget(key, site) {
  const t = TARGETS[key];
  if(!t) return null;
  const effectiveSite = SUB_SITES[site] ? SUB_SITES[site].baseSite : site;
  if(t.targetBySite) return t.targetBySite[effectiveSite] || t.targetNational;
  return t.target;
}

function achPct(key, val, site) {
  const t = TARGETS[key];
  if(!t || val==null) return null;
  const tgt = getTarget(key, site);
  if(!tgt) return null;
  return t.dir==='up' ? (val/tgt*100) : (tgt/val*100);
}

function achBadge(key, val, site) {
  const pct = achPct(key, val, site);
  if(pct==null) return '';
  const cls = pct>=100 ? 'hit' : pct>=90 ? 'warn' : 'miss';
  return `<span class="ac-badge ${cls}">${pct.toFixed(1)}%</span>`;
}

function fmtDelta(vA, vB, key, higherIsBetter) {
  if(vA==null||vB==null) return '<span class="d-nt">—</span>';
  const d = vB - vA;
  const up = d > 0;
  const good = higherIsBetter ? up : !up;
  const cls = d===0 ? 'd-nt' : (good ? 'd-up arrow-up' : 'd-dn arrow-dn');
  if(key==='tatDirect'||key==='tatStore') {
    const sign = d>=0?'+':'-';
    const abs = Math.abs(d);
    const h=Math.floor(abs); const m=Math.round((abs-h)*60);
    return `<span class="${cls}">${sign}${h}:${String(m).padStart(2,'0')}</span>`;
  }
  if(key==='olf') return `<span class="${cls}">${d>=0?'+':''}${(d*100).toFixed(1)}%</span>`;
  if(key==='totalDoCust'||key==='totalDpCust') {
    const sign = d>=0?'+':'';
    return `<span class="${cls}">${sign}${Math.round(d).toLocaleString('id-ID')}</span>`;
  }
  return `<span class="${cls}">${d>=0?'+':''}${Math.abs(d)<10?d.toFixed(2):d.toFixed(1)}</span>`;
}

const HIGHER_BETTER = { olf:true, ritase:true, dpStore:true, dpMix:true, dpNonReg:false, dpReg:true, doTrip:true, doDp:true, cbmDo:true, cbmDp:true, tatDirect:false, tatStore:false };
</script>

<script>
function buildKesimpulan(resA, resB, sumA, sumB) {
  const lines = { baik:[], perhatian:[] };
  const checks = [
    { key:'olf',label:'OLF Store',tgt:0.85,dir:'up',fmtV:v=>(v*100).toFixed(1)+'%',fmtT:'85%' },
    { key:'ritase',label:'Ritase',tgtFn:(site)=>getTarget('ritase',site),dir:'up',fmtV:v=>v.toFixed(2) },
    { key:'dpMix',label:'DP Mix',tgt:8.0,dir:'up',fmtV:v=>v.toFixed(1),fmtT:'8.0' },
    { key:'dpReg',label:'DP Reg',tgt:8.0,dir:'up',fmtV:v=>v.toFixed(1),fmtT:'8.0' },
    { key:'doTrip',label:'DO/Trip (Regular)',tgt:11.0,dir:'up',fmtV:v=>v.toFixed(1),fmtT:'11.0' },
  ];
  const site = currentSite==='ALL' ? null : currentSite;
  checks.forEach(c => {
    const val = site ? (resB.find(r=>r.site===site)||{})[c.key] : sumB[c.key];
    if(val==null) return;
    const tgt = c.tgtFn ? c.tgtFn(site||'JABABEKA') : c.tgt;
    const hit = c.dir==='up' ? val>=tgt : val<=tgt;
    if(hit) lines.baik.push(`${c.label} ${c.fmtV(val)} mencapai target ${c.fmtT||tgt}`);
    else lines.perhatian.push(`${c.label} ${c.fmtV(val)} belum mencapai target ${c.fmtT||tgt}`);
  });
  if(sumA && sumB) {
    const olfDelta = sumB.olf!=null&&sumA.olf!=null ? sumB.olf-sumA.olf : null;
    const tatDDelta = sumB.tatDirect!=null&&sumA.tatDirect!=null ? sumB.tatDirect-sumA.tatDirect : null;
    const tatSDelta = sumB.tatStore!=null&&sumA.tatStore!=null ? sumB.tatStore-sumA.tatStore : null;
    const doTDelta = sumB.doTrip!=null&&sumA.doTrip!=null ? sumB.doTrip-sumA.doTrip : null;
    const ritDelta = sumB.ritase!=null&&sumA.ritase!=null ? sumB.ritase-sumA.ritase : null;
    if(olfDelta!=null) {
      if(olfDelta>0) lines.baik.push(`OLF naik +${(olfDelta*100).toFixed(1)}% dibanding periode sebelumnya`);
      else if(olfDelta<-0.01) lines.perhatian.push(`OLF turun ${(olfDelta*100).toFixed(1)}% dibanding periode sebelumnya`);
    }
    if(tatDDelta!=null) {
      const h=Math.floor(Math.abs(tatDDelta)); const m=Math.round((Math.abs(tatDDelta)-h)*60);
      if(tatDDelta<0) lines.baik.push(`TAT Direct membaik ${h}:${String(m).padStart(2,'0')} jam lebih cepat`);
      else if(tatDDelta>0.1) lines.perhatian.push(`TAT Direct melambat +${h}:${String(m).padStart(2,'0')} jam`);
    }
    if(tatSDelta!=null) {
      const h=Math.floor(Math.abs(tatSDelta)); const m=Math.round((Math.abs(tatSDelta)-h)*60);
      if(tatSDelta<0) lines.baik.push(`TAT Store membaik ${h}:${String(m).padStart(2,'0')} jam lebih cepat`);
      else if(tatSDelta>0.1) lines.perhatian.push(`TAT Store melambat +${h}:${String(m).padStart(2,'0')} jam`);
    }
    if(doTDelta!=null) {
      if(doTDelta>0) lines.baik.push(`DO/Trip naik +${doTDelta.toFixed(1)} (lebih produktif)`);
      else if(doTDelta<-0.5) lines.perhatian.push(`DO/Trip turun ${doTDelta.toFixed(1)}`);
    }
    if(ritDelta!=null) {
      if(ritDelta>0) lines.baik.push(`Ritase naik +${ritDelta.toFixed(2)} (kepadatan armada membaik)`);
      else if(ritDelta<-0.02) lines.perhatian.push(`Ritase turun ${ritDelta.toFixed(2)}`);
    }
  }
  const cls = lines.perhatian.length > lines.baik.length ? 'evaluasi' : 'baik';
  const title = lines.perhatian.length === 0 ? '✅ Operasional Efisien' : (lines.baik.length >= lines.perhatian.length ? '⚠️ Cukup Baik, Ada yang Perlu Diperhatikan' : '⚠️ Perlu Evaluasi');
  let html = `<div class="kesimpulan ${cls}"><h4>${title}</h4><ul>`;
  lines.baik.forEach(l => html += `<li>✓ ${l}</li>`);
  lines.perhatian.forEach(l => html += `<li>⚠ ${l}</li>`);
  html += '</ul></div>';
  return html;
}

function renderComparison() {
  const s1=cmpA.start, e1=cmpA.end, s2=cmpB.start, e2=cmpB.end;
  if(!s1||!e1||!s2||!e2) {
    document.getElementById('cmpResult').innerHTML = '<p style="color:var(--t3);font-size:12px;padding:12px">Pilih kedua periode lalu klik Bandingkan.</p>';
    return;
  }
  const rowsA = filterRows(ROWS, s1, e1, currentSite);
  const rowsB = filterRows(ROWS, s2, e2, currentSite);
  const resA = currentSite==='ALL' ? computeAll(rowsA) : [computeSite(rowsA, currentSite)];
  const resB = currentSite==='ALL' ? computeAll(rowsB) : [computeSite(rowsB, currentSite)];
  const sumA = makeSummary(resA);
  const sumB = makeSummary(resB);
  const CMP_COLS = [
    { key:'ritase',label:'Ritase',fmt:function(v){return v!=null?v.toFixed(2):'—';},tgt:function(site){return {JABABEKA:1.15,CIKUPA:1.05,SDA:1.07,TALLO:1.25,TAMORA:1.25}[site]||1.15;},hi:true },
    { key:'olf',label:'OLF (Store)',fmt:function(v){return v!=null?(v*100).toFixed(1)+'%':'—';},tgt:function(){return 0.85;},hi:true },
    { key:'dpStore',label:'DP (Store)',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:null,hi:true },
    { key:'dpMix',label:'DP (Mix)',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:function(){return 8.0;},hi:true },
    { key:'dpNonReg',label:'DP Non Reg',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:null,hi:true },
    { key:'dpReg',label:'DP (Regular)',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:function(){return 8.0;},hi:true },
    { key:'doTrip',label:'DO/Trip (Regular)',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:function(){return 11.0;},hi:true },
    { key:'doTripAll',label:'DO/Trip (Mix)',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:null,hi:true },
    { key:'tatDirect',label:'TAT (Direct)',fmt:function(v){return tatStr(v);},tgt:null,hi:false },
    { key:'tatStore',label:'TAT (Store)',fmt:function(v){return tatStr(v);},tgt:null,hi:false },
    { key:'totalCbmStore',label:'CBM Store',fmt:function(v){return v!=null?v.toFixed(1):'—';},tgt:null,hi:true },
    { key:'totalDoCust',label:'DO Customer',fmt:function(v){return v!=null?Math.round(v).toLocaleString('id-ID'):'—';},tgt:null,hi:true },
    { key:'totalDpCust',label:'DP Customer',fmt:function(v){return v!=null?Math.round(v).toLocaleString('id-ID'):'—';},tgt:null,hi:true },
  ];

  function cmpCellCls(key, val, site) {
    var col = CMP_COLS.find(function(c){return c.key===key;});
    if(!col||!col.tgt||val==null) return '';
    var effectiveSite = SUB_SITES[site] ? SUB_SITES[site].baseSite : (site==='ALL'?'JABABEKA':site);
    var t = col.tgt(effectiveSite);
    if(!t) return '';
    var pct = col.hi ? val/t : t/val;
    if(pct>=1.0) return 'c-grn'; if(pct>=0.9) return 'c-yel'; return 'c-red';
  }
  function cmpPctStr(key, val, site) {
    var col = CMP_COLS.find(function(c){return c.key===key;});
    if(!col||!col.tgt||val==null) return '';
    var effectiveSite = SUB_SITES[site] ? SUB_SITES[site].baseSite : (site==='ALL'?'JABABEKA':site);
    var t = col.tgt(effectiveSite);
    if(!t) return '';
    var pct = col.hi ? val/t*100 : t/val*100;
    return '<br><span class="pct">'+pct.toFixed(0)+'%</span>';
  }

  const vA = currentSite==='ALL' ? sumA : (resA[0]||{});
  const vB = currentSite==='ALL' ? sumB : (resB[0]||{});
  function shortDate(s) {
    var mn=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return s.replace(/(\d{4})-(\d{2})-(\d{2})\s*—\s*(\d{4})-(\d{2})-(\d{2})/,
      function(_,y1,m1,d1,y2,m2,d2){return d1+' '+mn[+m1-1]+' '+y1.slice(2)+'<br>— '+d2+' '+mn[+m2-1]+' '+y2.slice(2);});
  }
  var hdrA = shortDate(s1+' — '+e1);
  var hdrB = shortDate(s2+' — '+e2);
  var site4cls = currentSite==='ALL' ? 'JABABEKA' : currentSite;
  var cmpRows = '';
  CMP_COLS.forEach(function(col) {
    var a=vA[col.key], b=vB[col.key];
    var clsA=cmpCellCls(col.key,a,site4cls), clsB=cmpCellCls(col.key,b,site4cls);
    var pA=cmpPctStr(col.key,a,site4cls), pB=cmpPctStr(col.key,b,site4cls);
    var delta=fmtDelta(a,b,col.key,col.hi);
    cmpRows+='<tr>'
      +'<td style="font-size:11px;color:var(--t2);font-weight:600;padding:7px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap">'+col.label+'</td>'
      +'<td class="num '+clsA+'" style="padding:7px 10px;border-bottom:0.5px solid var(--border);font-size:12px">'+col.fmt(a)+pA+'</td>'
      +'<td class="num '+clsB+'" style="padding:7px 10px;border-bottom:0.5px solid var(--border);font-size:12px">'+col.fmt(b)+pB+'</td>'
      +'<td class="num" style="padding:7px 10px;border-bottom:0.5px solid var(--border);font-size:11px">'+delta+'</td>'
      +'</tr>';
  });

  var summaryTable='<table class="dt ins-tbl" style="font-size:11px;min-width:0;width:100%"><thead><tr>'
    +'<th style="width:130px;text-align:left;padding:7px 10px;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Metrik</th>'
    +'<th class="num col-a" style="width:110px;padding:7px 10px;font-size:10px;letter-spacing:.3px">'+hdrA+'</th>'
    +'<th class="num col-b" style="width:110px;padding:7px 10px;font-size:10px;letter-spacing:.3px">'+hdrB+'</th>'
    +'<th class="num" style="width:60px;padding:7px 10px;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">Δ</th>'
    +'</tr></thead><tbody>'+cmpRows+'</tbody></table>';

  var siteCardsHtml = '';
  if(currentSite==='ALL') {
    var cards='';
    SITES.forEach(function(site){
      var a=resA.find(r=>r.site===site)||{}, b=resB.find(r=>r.site===site)||{};
      var rows='';
      CMP_COLS.forEach(function(m){
        var va=m.fmt(a[m.key]), vb=m.fmt(b[m.key]);
        var d=fmtDelta(a[m.key],b[m.key],m.key,m.hi);
        rows+='<tr>'
          +'<td style="font-size:11px;color:var(--t2);padding:5px 8px;border-bottom:0.5px solid var(--border)">'+m.label+'</td>'
          +'<td class="num" style="font-size:11px;padding:5px 8px;border-bottom:0.5px solid var(--border);color:#1a73e8">'+va+'</td>'
          +'<td class="num" style="font-size:11px;padding:5px 8px;border-bottom:0.5px solid var(--border);color:#e37400">'+vb+'</td>'
          +'<td class="num" style="font-size:11px;padding:5px 8px;border-bottom:0.5px solid var(--border)">'+d+'</td>'

<script>
function buildMonthlyTrendTable(container) {
  if(!container) return;
  const moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const {start:fs, end:fe} = getRange();
  const allMonths = [...new Set(ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();
  const COLS = [
    { key:'ritase',label:'Ritase',fmt:v=>v!=null?v.toFixed(2):'—',tgt:function(site){return {JABABEKA:1.15,CIKUPA:1.05,SDA:1.07,TALLO:1.25,TAMORA:1.25}[site]||1.15;},hi:true },
    { key:'olf',label:'OLF (Store)',fmt:v=>v!=null?(v*100).toFixed(1)+'%':'—',tgt:function(){return 0.85;},hi:true },
    { key:'dpStore',label:'DP (Store)',fmt:v=>v!=null?v.toFixed(1):'—',tgt:null,hi:true },
    { key:'dpMix',label:'DP (Mix)',fmt:v=>v!=null?v.toFixed(1):'—',tgt:function(){return 8.0;},hi:true },
    { key:'dpNonReg',label:'DP Non Reg',fmt:v=>v!=null?v.toFixed(1):'—',tgt:null,hi:true },
    { key:'dpReg',label:'DP (Regular)',fmt:v=>v!=null?v.toFixed(1):'—',tgt:function(){return 8.0;},hi:true },
    { key:'doTrip',label:'DO/Trip (Regular)',fmt:v=>v!=null?v.toFixed(1):'—',tgt:function(){return 11.0;},hi:true },
    { key:'doTripAll',label:'DO/Trip (Mix)',fmt:v=>v!=null?v.toFixed(1):'—',tgt:null,hi:true },
    { key:'tatDirect',label:'TAT (Direct)',fmt:v=>tatStr(v),tgt:null,hi:false },
    { key:'tatStore',label:'TAT (Store)',fmt:v=>tatStr(v),tgt:null,hi:false },
    { key:'totalCbmStore',label:'CBM Store',fmt:v=>v!=null?v.toFixed(1):'—',tgt:null,hi:true },
    { key:'totalDoCust',label:'DO Customer',fmt:v=>v!=null?Math.round(v).toLocaleString('id-ID'):'—',tgt:null,hi:true },
    { key:'totalDpCust',label:'DP Customer',fmt:v=>v!=null?Math.round(v).toLocaleString('id-ID'):'—',tgt:null,hi:true },
  ];
  const SITES_LIST = currentSite==='ALL' ? SITES : [currentSite];
  function cellCls(key,val,site) {
    var col=COLS.find(c=>c.key===key);
    if(!col||!col.tgt||val==null) return 'c-def';
    var effectiveSite=SUB_SITES[site]?SUB_SITES[site].baseSite:site;
    var t=col.tgt(effectiveSite); if(!t) return 'c-def';
    var pct=col.hi?val/t:t/val;
    if(pct>=1.0) return 'c-grn'; if(pct>=0.9) return 'c-yel'; return 'c-red';
  }
  function pctStr(key,val,site) {
    var col=COLS.find(c=>c.key===key);
    if(!col||!col.tgt||val==null) return '';
    var effectiveSite=SUB_SITES[site]?SUB_SITES[site].baseSite:site;
    var t=col.tgt(effectiveSite); if(!t) return '';
    var pct=col.hi?val/t*100:t/val*100;
    return '<br><span class="pct">'+pct.toFixed(0)+'%</span>';
  }
  const BADGE_KEYS = new Set(['tatDirect','tatStore','totalCbmStore','totalDoCust','totalDpCust']);
  var allResults={};
  allMonths.forEach(function(mo) {
    var {start:moD1,end:moD2}=getMonthRange(mo);
    SITES_LIST.forEach(function(site){
      var moFiltered=filterRows(ROWS,moD1,moD2,site);
      var moResult = null;
      if(site==='NDC_RDC'||site==='NDC'||site==='RDC') {
        var subSites = site==='NDC' ? SITES_NDC : site==='RDC' ? SITES_RDC : SITES;
        var subResults = subSites.map(function(s){ return computeSite(filterRows(ROWS,moD1,moD2,s),s); }).filter(Boolean);
        moResult = subResults.length ? {...makeSummary(subResults), site:site, label:SL[site]||site} : null;
      } else {
        moResult = moFiltered.length?(computeSite(moFiltered,site)||{}):null;
      }
      allResults[mo+'|'+site]=moResult;
    });
  });
  function momBadge(key,cur,prev,hi) {
    if(cur==null||prev==null) return '';
    var d=cur-prev; if(Math.abs(d)<0.001) return '';
    var good=hi?d>0:d<0;
    var color=good?'#0f9d58':'#d93025'; var arrow=d>0?'▲':'▼';
    var label;
    if(key==='tatDirect'||key==='tatStore'){var abs=Math.abs(d),h=Math.floor(abs),m=Math.round((abs-h)*60);label=(h>0?h+'j ':'')+m+'m';}
    else if(key==='totalDoCust'||key==='totalDpCust'){label=Math.round(Math.abs(d)).toLocaleString('id-ID');}
    else{label=Math.abs(d)<10?Math.abs(d).toFixed(1):Math.round(Math.abs(d)).toString();}
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+arrow+' '+label+'</span>';
  }
  var thead='<tr><th>Bulan</th><th>Site</th>';
  COLS.forEach(c=>{thead+='<th>'+c.label+'</th>';});
  thead+='</tr>';
  var tbody='';
  allMonths.forEach(function(mo,moIdx){
    var prevMo=moIdx>0?allMonths[moIdx-1]:null;
    SITES_LIST.forEach(function(site){
      var res=allResults[mo+'|'+site]; if(!res) return;
      var prevRes=prevMo?(allResults[prevMo+'|'+site]||null):null;
      var mn=moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
      var siteLbl=SL[site]||site;
      var tr='<tr>';
      tr+='<td style="color:var(--t2)">'+mn+'</td><td>'+siteLbl+'</td>';
      COLS.forEach(function(c){
        var v=res[c.key]; var cls=cellCls(c.key,v,site);
        var badge=BADGE_KEYS.has(c.key)?momBadge(c.key,v,prevRes?prevRes[c.key]:null,c.hi):'';
        tr+='<td class="'+cls+'">'+c.fmt(v)+pctStr(c.key,v,site)+badge+'</td>';
      });
      tr+='</tr>'; tbody+=tr;
    });
  });
  container.innerHTML='<table class="mtt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
}
</script>

<script>
// ── TRENDLINE WITH SMART LABEL OFFSET (PATCHED) ────────────────
(function() {
  // This IIFE runs after renderDetail sets up the canvas.
  // We hook into the existing render flow by extending it.
  var _origRenderDetail = window._origRenderDetail; // placeholder
})();

// Extend renderDetail to build trendline after its body runs
// The trendline code runs at the end of renderDetail — we override buildTrendline separately
function buildTrendline(results, summary, s, e) {
  var moNames2=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var allMonths=[...new Set(ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();
  // Trendline selalu tampil semua bulan — tidak ikut filter range
  var filterD1=parseInt(s.slice(8,10)), filterD2=parseInt(e.slice(8,10));
  var trendLabels=allMonths.map(function(mo){var arr=mo.split('-');return moNames2[parseInt(arr[1])-1]+' '+arr[0];});
  var trendData=allMonths.map(function(mo){
    var {start:d1,end:d2}=getMonthRange(mo);
    var moRows=filterRows(ROWS,d1,d2,currentSite);
    return currentSite==='ALL'?makeSummary(computeAll(moRows)):(computeSite(moRows,currentSite)||{});
  });

  var trendSeries=[
    {key:'olf',    label:'OLF',    color:'#E67E22', axis:'yR', fmt:function(v){return v!=null?+(v*100).toFixed(1):null;}, disp:function(v){return v.toFixed(1)+'%';}},
    {key:'doTrip', label:'DO/Trip (Regular)',color:'#1A73E8', axis:'yL', fmt:function(v){return v!=null?+v.toFixed(1):null;},       disp:function(v){return v.toFixed(1);}},
    {key:'dpReg',  label:'DP Reg', color:'#D62B1F', axis:'yL', fmt:function(v){return v!=null?+v.toFixed(1):null;},       disp:function(v){return v.toFixed(1);}},
    {key:'dpMix',  label:'DP Mix', color:'#7B2D8B', axis:'yL', fmt:function(v){return v!=null?+v.toFixed(1):null;},       disp:function(v){return v.toFixed(1);}},
    {key:'ritase', label:'Ritase', color:'#1E3448', axis:'yL', fmt:function(v){return v!=null?+v.toFixed(2):null;},       disp:function(v){return v.toFixed(2);}},
  ];

  var n=trendData.length;

  // ── Smart label: pixel-aware collision avoidance ──
  // Strategy: sort by value, then push labels apart with minimum gap
  // Each group (yL / yR) handled independently to avoid axis mixing
  function getRankOffsets(moIdx) {
    var groupL=[], groupR=[];
    trendSeries.forEach(function(s,i){
      var v=s.fmt(trendData[moIdx][s.key]);
      if(v==null) return;
      (s.axis==='yR'?groupR:groupL).push({i:i,v:v});
    });
    var offsets={};
    var MIN_GAP = 18; // min px between label centers
    function assign(grp) {
      if(!grp.length) return;
      // Sort by value descending (higher value = higher on chart = lower pixel y)
      grp.sort(function(a,b){return b.v-a.v;});
      // Assign initial offsets: 0 = center on point
      var pos = grp.map(function(){return 0;});
      // Iteratively push apart — run a few passes
      for(var iter=0; iter<10; iter++){
        for(var j=0; j<grp.length-1; j++){
          var gap = pos[j+1] - pos[j];
          if(gap < MIN_GAP){
            var push = (MIN_GAP - gap) / 2;
            pos[j]   -= push;
            pos[j+1] += push;
          }
        }
      }
      grp.forEach(function(item, rank){
        var px = Math.round(pos[rank]);
        var align, anchor;
        // px < 0 means label pushed up (above point), px > 0 means below
        if(px < -4)      { align='top';    anchor='end';    }
        else if(px > 4)  { align='bottom'; anchor='start';  }
        else             { align='center'; anchor='center'; }
        offsets[item.i] = {align:align, anchor:anchor, offset:Math.abs(px)+4};
      });
    }
    assign(groupL); assign(groupR);
    return offsets;
  }

  var offsetFirst=n>0?getRankOffsets(0):{};
  var offsetLast=n>0?getRankOffsets(n-1):{};

  var trendDatasets=trendSeries.map(function(s,i){
    var vals=trendData.map(function(d){return s.fmt(d[s.key]);});
    // Trim trailing null/zero values (e.g. OLF not yet available for latest month)
    if(s.key==='olf') {
      var lastValid=vals.length-1;
      while(lastValid>=0 && (vals[lastValid]==null||vals[lastValid]===0)) lastValid--;
      for(var ti=lastValid+1;ti<vals.length;ti++) vals[ti]=null;
    }
    var hasData=vals.some(function(v){return v!=null&&v!==0;});
    return {
      label:s.label, data:vals,
      borderColor:s.color, pointBackgroundColor:'#ffffff',
      pointBorderColor:s.color, pointBorderWidth:2,
      backgroundColor:'transparent',
      borderWidth:2.5, pointRadius:5, pointHoverRadius:7,
      tension:0.35, fill:false, yAxisID:s.axis,
      hidden:!hasData,
      datalabels:{ display:false }
    };
  });

  // ── End-label plugin: value on ALL points, series name at right end only ──
  var endLabelPlugin={
    id:'endLabel',
    afterDatasetsDraw:function(chart){
      var ctx=chart.ctx;
      var right=chart.chartArea.right;
      var MIN_GAP=14;

      function relaxY(items){
        items.sort(function(a,b){return a.y-b.y;});
        for(var iter=0;iter<30;iter++){
          for(var j=0;j<items.length-1;j++){
            var gap=items[j+1].y-items[j].y;
            if(gap<MIN_GAP){ var push=(MIN_GAP-gap)/2; items[j].y-=push; items[j+1].y+=push; }
          }
        }
        return items;
      }

      function fmtDisplay(s, fmtVal){
        if(fmtVal==null) return '';
        return s.key==='olf' ? fmtVal.toFixed(1)+'%' : fmtVal.toFixed(s.key==='ritase'?2:1);
      }

      ctx.save();
      ctx.font='bold 10px Inter,sans-serif';
      ctx.textBaseline='middle';

      // ── Value label above every dot ──
      trendSeries.forEach(function(s,i){
        var ds=trendDatasets[i]; if(!ds||ds.hidden) return;
        var meta=chart.getDatasetMeta(i); if(meta.hidden) return;
        ctx.fillStyle=s.color;
        ctx.textAlign='center';
        meta.data.forEach(function(pt, ptIdx){
          var fmtVal=trendDatasets[i].data[ptIdx];
          if(fmtVal==null) return;
          ctx.fillText(fmtDisplay(s, fmtVal), pt.x, pt.y-12);
        });
      });

      // ── Series name at right end only (with collision avoidance) ──
      var lastItems=[];
      trendSeries.forEach(function(s,i){
        var ds=trendDatasets[i]; if(!ds||ds.hidden) return;
        var meta=chart.getDatasetMeta(i); if(meta.hidden) return;
        var pt=meta.data[meta.data.length-1]; if(!pt) return;
        lastItems.push({y:pt.y, color:s.color, label:s.label});
      });
      relaxY(lastItems);
      ctx.textAlign='left';
      lastItems.forEach(function(item){
        ctx.fillStyle=item.color;
        ctx.fillText(item.label, right+8, item.y);
      });

      ctx.restore();
    }
  };

  var canvas=document.getElementById('dTREND');
  if(!canvas) return;
  charts.dTREND=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels:trendLabels,datasets:trendDatasets},
    plugins:[endLabelPlugin],
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{
          display:true,
          position:'top',
          labels:{
            color:'#64748b',
            font:{family:'Inter',size:11,weight:'500'},
            boxWidth:10, boxHeight:10,
            padding:20,
            usePointStyle:true, pointStyle:'circle'
          }
        },
        tooltip:{
          backgroundColor:'#ffffff',
          borderColor:'#e2e8f0',
          borderWidth:1,
          titleColor:'#0f172a',
          bodyColor:'#64748b',
          titleFont:{family:'Inter',size:12,weight:'600'},
          bodyFont:{family:'Inter',size:11},
          padding:10,
          cornerRadius:8,
          callbacks:{label:function(ctx){
            var ts=trendSeries[ctx.datasetIndex];
            var raw=trendData[ctx.dataIndex][ts.key];
            return '  '+ts.label+': '+(raw!=null?ts.disp(raw):'—');
          }}
        },
        datalabels:{display:false}
      },
      scales:{
        x:{
          ticks:{color:'#94a3b8',font:{family:'Inter',size:11},padding:6},
          grid:{color:'#f1f5f9'},
          border:{display:false}
        },
        yL:{display:false,min:0,max:25},
        yR:{display:false,min:0,max:100}
      },
      layout:{padding:{top:20,right:80,bottom:8,left:40}}
    }
  });
}

// Source: UTIL_ROWS from data_utilisasi.json
// Site mapping:
//   HCI JABABEKA + AHI JABABEKA → JABABEKA (corporate)
//   JAB_HCI → HCI JABABEKA only
//   JAB_AHI → AHI JABABEKA only
//   HCI CIKUPA → CIKUPA
//   CORP SIDOARJO → SDA
//   CORP TALLO → TALLO
//   CORP TAMORA → TAMORA
// Formulae:
//   Utilisasi MPP Driver    = sum(drv_aktual) / sum(drv_plan) * 100
//   Utilisasi MPP Ast.Driver= sum(ast_aktual) / sum(ast_plan) * 100
//   Utilisasi Armada        = sum(arm_util)   / sum(arm_avail) * 100
//   Availability Armada     = sum(arm_avail)  / sum(arm_assets) * 100

};

  'CIKUPA':  ['HCI CIKUPA'],
  'SDA':     ['CORP SIDOARJO'],
  'SDA_HCI': null, // data utilisasi tidak tersedia per BU

function filterUtilRows(start, end, site) {
  var srcSites = UTIL_SUBSITE_MAP[site];
  // null = data tidak tersedia untuk sub-BU ini
  if(srcSites === null) return {rows:[], allRows:[]};
  // undefined = fallback semua site
  if(srcSites === undefined) srcSites = Object.keys(UTIL_SITE_MAP);

  // ALL rows in range — untuk assets (semua hari, assets = fixed)
  var allRows = UTIL_ROWS.filter(function(r) {
    if(!r.date || r.date < start || r.date > end) return false;
    return srcSites.includes(r.site);
  });

  // Per-site SO (Shut Out) dates — exclude dari UTL tapi bukan dari assets
  var SO_DATES = {
    'CORP SIDOARJO': new Set(['2026-05-20','2026-05-21','2026-05-22','2026-05-23']),
  };

  // ACTIVE rows — exclude holidays + Minggu (semua site) + SO dates + arm_util null/0
  var rows = UTIL_ROWS.filter(function(r) {
    if(!r.date || r.date < start || r.date > end) return false;
    if(!srcSites.includes(r.site)) return false;
    if(HOLIDAYS_2026.has(r.date)) return false;
    if(new Date(r.date).getDay()===0) return false; // Minggu
    var soDates = SO_DATES[r.site];
    if(soDates && soDates.has(r.date)) return false; // Shut Out
    return r.arm_util != null && r.arm_util > 0;
  });

  if(site === 'JABABEKA' && srcSites.length > 1) {
    var byDate = {};
    rows.forEach(function(r) {
      if(!byDate[r.date]) byDate[r.date] = [];
      byDate[r.date].push(r);
    });
    var merged = [];
    Object.keys(byDate).sort().forEach(function(date) {
      var dayRows = byDate[date];
      function sumF(key) { return dayRows.reduce(function(s,r){ return s+(r[key]||0); },0); }
      function sumFNullable(key) {
        var vals = dayRows.map(function(r){ return r[key]; }).filter(function(v){ return v!=null; });
        return vals.length ? vals.reduce(function(s,v){ return s+v; },0) : null;
      }
      var ahi = dayRows.find(function(r){ return r.site === 'AHI JABABEKA'; });
      var hci = dayRows.find(function(r){ return r.site === 'HCI JABABEKA'; });
      // AHI arm_assets often null — fallback to arm_avail as proxy
      function getAssets(r) {
        if(!r) return 0;
        return (r.arm_assets != null) ? r.arm_assets : (r.arm_avail || 0);
      }
      merged.push({
        site: 'JABABEKA', date: date,
        drv_plan:   sumF('drv_plan'),
        drv_aktual: sumF('drv_aktual'),
        ast_plan:   sumF('ast_plan'),
        ast_aktual: sumF('ast_aktual'),
        arm_assets: getAssets(hci) + getAssets(ahi) || null,
        arm_avail:  sumFNullable('arm_avail'),
        arm_util:   sumFNullable('arm_util'),
        ritase_armada: (function(){ var vals=dayRows.map(function(r){return r.ritase_armada;}).filter(function(v){return v!=null&&v>0;}); return vals.length?vals.reduce(function(s,v){return s+v;},0)/vals.length:null; })(),
        ritase_mpp:    (function(){ var vals=dayRows.map(function(r){return r.ritase_mpp;}).filter(function(v){return v!=null&&v>0;}); return vals.length?vals.reduce(function(s,v){return s+v;},0)/vals.length:null; })(),
      });
    });
    return {rows: merged, allRows: merged};
  }
  return {rows: rows, allRows: allRows};
}

function computeUtil(rows, allRows, site) {
  if(!rows.length) return null;
  var drvPlan=0, drvAkt=0, astPlan=0, astAkt=0;
  var armAssetsList=[], armAvailList=[], armUtilList=[];

  // Assets untuk DISPLAY: pakai allRows (semua hari, assets = fixed)
  var assetRows = allRows && allRows.length ? allRows : rows;
  var rawAssetsAll = assetRows.map(function(r){ return r.arm_assets; }).filter(function(v){ return v!=null && v>0; });
  rawAssetsAll.sort(function(a,b){return a-b;});
  var medAll = rawAssetsAll.length ? rawAssetsAll[Math.floor(rawAssetsAll.length/2)] : null;
  // Hardcoded override untuk site tanpa data assets di Utilisasi sheet
  var hardcodedAssets = site ? (UTIL_HARDCODED_ASSETS[site] || null) : null;
  var displayAssets = hardcodedAssets || medAll; // hardcode takes priority

  // Avail & Util: pakai filtered rows (hari aktif saja)
  var rawAssets = rows.map(function(r){ return r.arm_assets; }).filter(function(v){ return v!=null && v>0; });
  rawAssets.sort(function(a,b){return a-b;});
  var medAssets = rawAssets.length ? rawAssets[Math.floor(rawAssets.length/2)] : null;

  rows.forEach(function(r) {
    var hasActivity = r.arm_util != null && r.arm_util > 0;
    var assetOk = !medAssets || !r.arm_assets || (r.arm_assets <= medAssets * 2.0);
    drvPlan   += r.drv_plan   || 0;
    drvAkt    += r.drv_aktual || 0;
    astPlan   += r.ast_plan   || 0;
    astAkt    += r.ast_aktual || 0;
    if(hasActivity && assetOk) {
      if(r.arm_assets != null) armAssetsList.push(r.arm_assets);
      if(r.arm_avail  != null) armAvailList.push(r.arm_avail);
      if(r.arm_util   != null) armUtilList.push(r.arm_util);
    }
  });

  var avg = function(arr) { return arr.length ? arr.reduce(function(s,v){return s+v;},0)/arr.length : null; };
  var avgAssets = hardcodedAssets || avg(armAssetsList); // hardcode overrides availability calc too
  var avgAvail  = avg(armAvailList);
  var avgUtil   = avg(armUtilList);

  // Ritase Armada & MPP: aggregate per tanggal dari semua rows (hindari double count)
  var ritSrc = allRows && allRows.length ? allRows : rows;
  var ritByDate = {};
  ritSrc.forEach(function(r) {
    if(!r.date) return;
    if(!ritByDate[r.date]) ritByDate[r.date] = {armada:[], mpp:[]};
    if(r.ritase_armada != null && r.ritase_armada > 0) ritByDate[r.date].armada.push(r.ritase_armada);
    if(r.ritase_mpp    != null && r.ritase_mpp    > 0) ritByDate[r.date].mpp.push(r.ritase_mpp);
  });
  var ritArmadaVals = Object.values(ritByDate).map(function(v){ return v.armada.length ? v.armada.reduce(function(s,x){return s+x;},0)/v.armada.length : null; }).filter(function(v){ return v!=null; });
  var ritMppVals    = Object.values(ritByDate).map(function(v){ return v.mpp.length   ? v.mpp.reduce(function(s,x){return s+x;},0)/v.mpp.length     : null; }).filter(function(v){ return v!=null; });

  return {
    drvUtil:      drvPlan  > 0 ? drvAkt  / drvPlan  * 100 : null,
    astUtil:      astPlan  > 0 ? astAkt  / astPlan  * 100 : null,
    armAssets:    displayAssets || avgAssets,
    armAvailAbs:  avgAvail,
    armAvailPct:  (avgAssets && avgAvail) ? avgAvail / avgAssets * 100 : null,
    armUtilPct:   (avgAvail  && avgUtil)  ? avgUtil  / avgAvail  * 100 : null,
    ritaseArmada: avg(ritArmadaVals),
    ritaseMpp:    avg(ritMppVals),
  };
}

function buildMonthlyUtilTable(container) {
  if(!container) return;
  if(!UTIL_ROWS.length) {
    container.innerHTML = '<p style="color:var(--t3);font-size:12px;padding:14px 16px">Data utilisasi belum tersedia (data_utilisasi.json tidak ditemukan).</p>';
    return;
  }
  var moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var {start:fs, end:fe} = getRange();
  var allMonths = [...new Set(UTIL_ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();
  var fsMonth=fs.slice(0,7); var feMonth=fe.slice(0,7);
  allMonths=allMonths.filter(function(mo){ return mo<=feMonth; });
  var SITES_LIST = currentSite==='ALL' ? SITES : currentSite==='NDC_RDC' ? ['NDC_RDC'] : currentSite==='NDC' ? ['NDC'] : currentSite==='RDC' ? ['RDC'] : [currentSite];

  // Compute per month per site
  var allData = {};
  allMonths.forEach(function(mo) {
    var {start:moD1,end:moD2}=getMonthRange(mo);
    SITES_LIST.forEach(function(site) {
      var groupSites = site==='NDC_RDC' ? SITES : site==='NDC' ? SITES_NDC : site==='RDC' ? SITES_RDC : null;
      if(groupSites) {
        // Aggregate all sites in group
        var allR = [], filtR = [];
        groupSites.forEach(function(s) {
          var r = filterUtilRows(moD1, moD2, s);
          filtR = filtR.concat(r.rows);
          allR = allR.concat(r.allRows);
        });
        allData[mo+'|'+site] = filtR.length ? computeUtil(filtR, allR, site) : null;
      } else {
        var result = filterUtilRows(moD1, moD2, site);
        allData[mo+'|'+site] = result.rows.length ? computeUtil(result.rows, result.allRows, site) : null;
      }
    });
  });

  // Color helper: green ≥95%, yellow ≥85%, red <85%
  function utilCls(pct) {
    if(pct==null) return '';
    if(pct>=95) return 'c-grn'; if(pct>=85) return 'c-yel'; return 'c-red';
  }
  function pf(v, d) { return v!=null ? v.toFixed(d||1)+'%' : '—'; }
  function pfN(v) { return v!=null ? Math.round(v).toLocaleString('id-ID') : '—'; }
  function momBadge(cur, prev) {
    if(cur==null||prev==null) return '';
    var d=cur-prev; if(Math.abs(d)<0.05) return '';
    var color=d>0?'#0f9d58':'#d93025';
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+Math.abs(d).toFixed(1)+'%</span>';
  }
  function momBadgeRaw(cur, prev, dec) {
    if(cur==null||prev==null) return '';
    var d=cur-prev; if(Math.abs(d)<0.005) return '';
    var color=d>0?'#0f9d58':'#d93025';
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+Math.abs(d).toFixed(dec||2)+'</span>';
  }

  var thead = '<tr>'
    +'<th style="text-align:left">Bulan</th>'
    +'<th style="text-align:left">Site</th>'
    +'<th style="text-align:center;color:#1a73e8">UTL Driver</th>'
    +'<th style="text-align:center;color:#34a85a">UTL Ast. Driver</th>'
    +'<th style="text-align:center;color:#a142f4">Armada Assets</th>'
    +'<th style="text-align:center;color:#a142f4">Availability</th>'
    +'<th style="text-align:center;color:#e37400">UTL Armada</th>'
    +'<th style="text-align:center;color:#e37400">Ritase Armada</th>'
    +'<th style="text-align:center;color:#1a73e8">Ritase MPP</th>'
    +'</tr>';

  var tbody = '';
  allMonths.forEach(function(mo, moIdx) {
    var prevMo = moIdx > 0 ? allMonths[moIdx-1] : null;
    SITES_LIST.forEach(function(site) {
      var key = mo+'|'+site;
      var d = allData[key]; if(!d) return;
      var prev = prevMo ? allData[prevMo+'|'+site] : null;
      var mn = moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
      var tr = '<tr>'
        +'<td style="color:var(--t2);font-size:11px;white-space:nowrap">'+mn+'</td>'
        +'<td style="font-weight:600;font-size:11px">'+(SL[site]||site)+'</td>'
        +'<td class="'+utilCls(d.drvUtil)+'" style="text-align:center;font-size:11px;font-family:\'JetBrains Mono\',monospace">'+pf(d.drvUtil)+momBadge(d.drvUtil, prev?prev.drvUtil:null)+'</td>'

// ── COST ANALYSIS ─────────────────────────────────────────────
// Fields: r.jalur, r.ujp, r.cost, r.pf, r.sewa, r.lc, r.do, r.cbm

// Global TD color/label maps
const TD_COLOR = {'customer':'#1a73e8','store':'#34a85a','satelite':'#e37400','hub':'#a142f4','transfer':'#d93025'};
const TD_LABEL = {'customer':'Trip Customer','store':'Trip Store','satelite':'Trip Satelite','hub':'Trip Hub','transfer':'Trip Transfer (NDC/RDC/SDC)'};
function tdColor(td) { return TD_COLOR[td] || '#9aa0a6'; }
function tdLabel(td) { return TD_LABEL[td] || ('Trip '+td.charAt(0).toUpperCase()+td.slice(1)); }

function fmtRp(v) {
  if(v==null) return '—';
  if(v>=1e9) return (v/1e9).toFixed(2)+' M';
  if(v>=1e6) return (v/1e6).toFixed(1)+' jt';
  return Math.round(v).toLocaleString('id-ID');
}
function fmtRpFull(v) {
  if(v==null) return '—';
  return Math.round(v).toLocaleString('id-ID');
}
function momCost(cur, prev) {
  if(cur==null||prev==null) return '';
  var d=cur-prev; if(Math.abs(d)<1000) return '';
  var color=d>0?'#b91c1c':'#166534'; // cost naik = merah, turun = hijau
  return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+fmtRp(Math.abs(d))+'</span>';
}

function computeCost(rows) {
  if(!rows.length) return null;
  var ujp=0, cost=0, pf=0, sewa=0, cbm=0;
  var lcSet = new Set();
  var byTd = {customer:{cost:0,do:0,cbm:0}, store:{cost:0,do:0,cbm:0}, hub:{cost:0,do:0,cbm:0}, satelite:{cost:0,do:0,cbm:0}};
  rows.forEach(function(r) {
    if(r.ujp)  ujp  += r.ujp;
    if(r.cost) cost += r.cost;
    if(r.pf)   pf   += r.pf;
    if(r.sewa) sewa += r.sewa;
    if(r.cbm)  cbm  += parseFloat(r.cbm)||0;
    if(r.lc)   lcSet.add(r.lc);
    var td = (r.td||'').toLowerCase().trim();
    if(byTd[td]) {
      byTd[td].cost += r.cost||0;
      byTd[td].do   += parseFloat(r.do)||0;
      byTd[td].cbm  += parseFloat(r.cbm)||0;
    }
  });
  var trip = lcSet.size;
  return {
    ujp, cost, pf, sewa, trip, cbm,
    costTrip:    trip>0               ? cost/trip                   : null,
    costDoCust:  byTd.customer.do>0   ? byTd.customer.cost/byTd.customer.do   : null,
    costDoStore: byTd.store.do>0      ? byTd.store.cost/byTd.store.do         : null,
    costDoHub:   byTd.hub.do>0        ? byTd.hub.cost/byTd.hub.do             : null,
    costCbm:     cbm>0                ? cost/cbm                   : null,
    costCbmCust:  byTd.customer.cbm>0  ? byTd.customer.cost/byTd.customer.cbm  : null,
    costCbmStore: byTd.store.cbm>0     ? byTd.store.cost/byTd.store.cbm        : null,
    costCbmHub:   byTd.hub.cbm>0       ? byTd.hub.cost/byTd.hub.cbm            : null,
    ujpTrip:     trip>0               ? ujp/trip                   : null,
  };
}

        +'<td style="font-size:11px;font-weight:600">'+(SL[site]||site)+'</td>';

        var d=moData[mo+'|'+site+'|'+td];

        } else {
          var pct=tot.cost>0?(d.cost/tot.cost*100).toFixed(0):'';
          tr+='<td style="text-align:right;font-size:10.5px;font-family:\'JetBrains Mono\',monospace;color:'+tdColor(td)+'">'+fmtRp(d.cost)
            +'<br><span style="font-size:9px;color:var(--t3)">'+pct+'%</span></td>'
            +'<td style="text-align:right;font-size:10.5px;font-family:\'JetBrains Mono\',monospace;color:var(--t2)">'+fmtRp(d.costTrip)+'</td>';
