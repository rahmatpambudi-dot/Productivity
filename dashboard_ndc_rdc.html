      });
      tr+='<td style="text-align:right;font-size:11px;font-weight:700;color:#1d4ed8;font-family:\'JetBrains Mono\',monospace">'+fmtRp(tot.cost)+momCost(tot.cost,prevTot?prevTot.cost:null)+'</td>';
      tr+='</tr>';
      tbody+=tr;
    });
  });

  container.innerHTML=
    '<div style="overflow-x:auto"><table class="mtt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
}

function buildCostBySegment(container) {
  if(!container) return;
  var moNames=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var {start:fs, end:fe} = getRange();
  var allMonths=[...new Set(ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();

  allMonths=allMonths.filter(function(mo){ return mo<=feMonth; });
  var SITES_LIST = currentSite==='ALL' ? SITES : currentSite==='NDC_RDC' ? ['NDC_RDC'] : currentSite==='NDC' ? ['NDC'] : currentSite==='RDC' ? ['RDC'] : [currentSite];

  // TD normalization (same as trip type table)
  function normTd(td) {
    td = (td||'').toLowerCase().trim();
    if(!td||td==='#n/a'||td==='n/a'||td==='-'||td==='#value!') return null;

    return td;
  }

  // Discover all td types
  var tdSet = new Set();
  ROWS.forEach(function(r) { var t=normTd(r.td); if(t) tdSet.add(t); });
  const TD_ORDER = ['customer','store','hub','satelite','transfer'];
  var tdTypes = [
    ...TD_ORDER.filter(t=>tdSet.has(t)),
    ...[...tdSet].filter(t=>!TD_ORDER.includes(t)).sort()
  ];

  // ── MONTHLY by segment ──
  var moData = {}; // key: mo|site|td → computeCost result
  allMonths.forEach(function(mo) {
    var {start:moD1,end:moD2}=getMonthRange(mo);
    SITES_LIST.forEach(function(site) {
      var moFiltered=filterRows(ROWS,moD1,moD2,site);

      if(site==='NDC_RDC'||site==='NDC'||site==='RDC') {

        var effectiveSite=sub?sub.baseSite:site;
        sr=moFiltered.filter(r=>r.site===effectiveSite);

      tdTypes.forEach(function(td) {
        moData[mo+'|'+site+'|'+td] = byTd[td] ? computeCost(byTd[td]) : null;
      });
      moData[mo+'|'+site+'|_total'] = computeCost(sr);
    });
  });

  // Build thead — Bulan | Site | [td cols each: Cost + Cost/Trip] | Total Cost
  var thead='<tr><th style="text-align:left">Bulan</th><th style="text-align:left">Site</th>';
  tdTypes.forEach(function(td) {

  // Sub-header
  thead+='<tr><th></th><th></th>';
  tdTypes.forEach(function(td) {
    thead+='<th style="text-align:right;font-size:9px;color:var(--t3)">Cost</th>'
          +'<th style="text-align:right;font-size:9px;color:var(--t3)">Cost/Trip</th>';
  });
  thead+='<th></th></tr>';

  var tbody='';
  allMonths.forEach(function(mo,moIdx) {
    var prevMo=moIdx>0?allMonths[moIdx-1]:null;
    SITES_LIST.forEach(function(site) {
      var totKey=mo+'|'+site+'|_total';
      var tot=moData[totKey]; if(!tot) return;
      var mn=moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
      var tr='<tr>'
        +'<td style="font-size:11px;color:var(--t2);white-space:nowrap">'+mn+'</td>'
        +'<td style="font-size:11px;font-weight:600">'+(SL[site]||site)+'</td>';
      tdTypes.forEach(function(td) {
        var d=moData[mo+'|'+site+'|'+td];
        var prev=prevMo?moData[prevMo+'|'+site+'|'+td]:null;
        if(!d||!d.cost) {
          tr+='<td style="text-align:right;color:var(--t3);font-size:11px">—</td>'
             +'<td style="text-align:right;color:var(--t3);font-size:11px">—</td>';

             +'<td style="text-align:right;font-size:10px;color:var(--t2);font-family:\'JetBrains Mono\',monospace">'+fmtRp(d.costTrip)+'</td>';
        }
      });

      tr+='<td style="text-align:right;font-size:11px;font-weight:700;color:#1d4ed8;font-family:\'JetBrains Mono\',monospace">'+fmtRp(tot.cost)+momCost(tot.cost,prevTot?prevTot.cost:null)+'</td>';
      tr+='</tr>';
      tbody+=tr;
    });
  });

  container.innerHTML=
    '<div style="overflow-x:auto"><table class="mtt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';

// ── TRIP COUNT BY TYPE DELIVERY (r.td) ─────────────────────────
// COUNTUNIQUE r.lc (kolom A) grouped by r.td (kolom J / Type Delivery)
// Types auto-discovered from data. Fixed color per type for consistency.
function buildMonthlyTripTypeTable(container) {
  if (!container) return;
  const moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const {start: fs, end: fe} = getRange();
  const allMonths = [...new Set(ROWS.map(r => r.date ? r.date.slice(0,7) : null).filter(Boolean))].sort();
  const SITES_LIST = currentSite==='ALL' ? SITES : currentSite==='NDC_RDC' ? ['NDC_RDC'] : currentSite==='NDC' ? ['NDC'] : currentSite==='RDC' ? ['RDC'] : [currentSite];

  // ── 1. Discover all unique r.td values present in data ──
  const tdSet = new Set();
  ROWS.forEach(r => { if (r.td) tdSet.add((r.td+'').toLowerCase().trim()); });

  // ── 2. Compute COUNTUNIQUE r.lc per month per site per td ──
  var allData = {}; // key: mo+'|'+site → { td: Set<lc>, _total: Set<lc> }
  allMonths.forEach(function(mo) {
    var {start:moD1,end:moD2}=getMonthRange(mo);
    SITES_LIST.forEach(function(site) {
      var moFiltered = filterRows(ROWS, moD1, moD2, site);
      var sub = SUB_SITES[site];
      var sr;
      if(site==='NDC_RDC'||site==='NDC'||site==='RDC') {
        sr = moFiltered; // already filtered by group
      } else {
        var effectiveSite = sub ? sub.baseSite : site;
        sr = moFiltered.filter(r => r.site === effectiveSite);
      }
      if (!sr.length) return;
      var entry = { _total: new Set() };
      sr.forEach(r => {
        if (!r.lc) return;
        var td = (r.td || '').toLowerCase().trim();
        // null / empty / #n/a → count in total only, no column
        var isUnknown = !td || td === '#n/a' || td === 'n/a' || td === '-' || td === '#value!';
        entry['_total'].add(r.lc);
        if (isUnknown) return;

        if (!entry[td]) entry[td] = new Set();
        entry[td].add(r.lc);
      });
      allData[mo + '|' + site] = entry;
    });
  });

  // ── 3. Order td types: customer > store > hub > satelite > transfer > pickup > others ──
  const TD_ORDER = ['customer','store','hub','satelite','transfer'];
  var allTdFound = [...new Set(
    Object.values(allData).flatMap(e => Object.keys(e).filter(k => k !== '_total'))
  )];
  var tdTypes = [
    ...TD_ORDER.filter(t => allTdFound.includes(t)),
    ...allTdFound.filter(t => !TD_ORDER.includes(t)).sort()
  ];

  // ── 4. MoM badge for total ──
  function momBadge(cur, prev) {
    if (cur == null || prev == null) return '';
    var d = cur - prev;
    if (d === 0) return '';
    var color = d > 0 ? '#0f9d58' : '#d93025';
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+' '+Math.abs(d).toLocaleString('id-ID')+'</span>';
  }

  // ── 5. Build thead ──
  var thead = '<tr>'
    + '<th style="text-align:left;min-width:80px">Bulan</th>'
    + '<th style="text-align:left;min-width:90px">Site</th>';
  tdTypes.forEach(function(td) {
    thead += '<th style="text-align:center;color:'+tdColor(td)+'">'+tdLabel(td)+'</th>';
  });
  thead += '<th style="text-align:center;background:#f0f4f9">TOTAL TRIP</th></tr>';

  // ── 6. Build tbody ──
  var tbody = '';
  allMonths.forEach(function(mo, moIdx) {
    var prevMo = moIdx > 0 ? allMonths[moIdx - 1] : null;
    SITES_LIST.forEach(function(site) {
      var key = mo + '|' + site;
      var entry = allData[key];
      if (!entry) return;
      var total = entry['_total'].size;
      if (!total) return;
      var prevEntry = prevMo ? allData[prevMo + '|' + site] : null;
      var prevTotal = prevEntry ? prevEntry['_total'].size : null;
      var mn = moNames[parseInt(mo.slice(5,7)) - 1] + ' ' + mo.slice(0,4);
      var siteLbl = SL[site] || site;
      var tr = '<tr>';
      tr += '<td style="color:var(--t2);font-size:11px;white-space:nowrap">'+mn+'</td>';
      tr += '<td style="font-weight:600;font-size:11px">'+siteLbl+'</td>';
      tdTypes.forEach(function(td) {
        var cnt = entry[td] ? entry[td].size : 0;
        var prevCnt = prevEntry && prevEntry[td] ? prevEntry[td].size : null;
        var pct = total > 0 ? (cnt / total * 100).toFixed(1) : '0.0';
        if (cnt === 0) {
          tr += '<td style="text-align:center;color:var(--t3);font-size:11px">—</td>';
        } else {
          var mom = '';
          if(prevCnt!=null && cnt!==prevCnt) {
            var d = cnt - prevCnt;
            var color = d>0?'#0f9d58':'#d93025';
            mom = '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+Math.abs(d).toLocaleString('id-ID')+'</span>';
          }
          tr += '<td style="text-align:center;font-size:11px;font-weight:600;font-family:\'JetBrains Mono\',monospace">'
            + '<span style="color:'+tdColor(td)+'">'+cnt.toLocaleString('id-ID')+'</span>'
            + mom
            + '<br><span style="font-size:9px;color:var(--t3);font-weight:400">'+pct+'%</span>'
            + '</td>';
        }
      });
      tr += '<td style="text-align:center;font-size:12px;font-weight:700;font-family:\'JetBrains Mono\',monospace;background:#f0f4f9">'
        + total.toLocaleString('id-ID')
        + momBadge(total, prevTotal)
        + '</td>';
      tr += '</tr>';
      tbody += tr;
    });
  });

  // ── 7. Grand total row ──
  var grandTotals = {};
  tdTypes.forEach(function(td) {
    grandTotals[td] = Object.values(allData).reduce(function(s, e) { return s + (e[td] ? e[td].size : 0); }, 0);
  });
  var grandTotal = Object.values(allData).reduce(function(s, e) { return s + e['_total'].size; }, 0);
  var sumRow = '<tr style="background:var(--gbg);border-top:2px solid var(--gl)">';
  sumRow += '<td colspan="2" style="font-size:11px;color:var(--green);font-weight:700;padding:7px 10px">GRAND TOTAL</td>';
  tdTypes.forEach(function(td) {
    var cnt = grandTotals[td];
    var pct = grandTotal > 0 ? (cnt / grandTotal * 100).toFixed(1) : '0.0';
    sumRow += '<td style="text-align:center;font-size:11px;font-weight:700;color:var(--green);font-family:\'JetBrains Mono\',monospace">'
      + cnt.toLocaleString('id-ID')
      + '<br><span style="font-size:9px;color:var(--gm);font-weight:600">'+pct+'%</span>'
      + '</td>';
  });
  sumRow += '<td style="text-align:center;font-size:13px;font-weight:700;color:var(--green);background:var(--gbg);font-family:\'JetBrains Mono\',monospace">'
    + grandTotal.toLocaleString('id-ID') + '</td>';
  sumRow += '</tr>';

  // ── 8. Legend strip ──
  var legendHtml = '<div style="display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg)">';
  tdTypes.forEach(function(td) {
    var cnt = grandTotals[td];
    var pct = grandTotal > 0 ? (cnt / grandTotal * 100).toFixed(1) : '0.0';
    legendHtml += '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">'
      + '<span style="width:10px;height:10px;border-radius:50%;background:'+tdColor(td)+';flex-shrink:0;display:inline-block"></span>'
      + '<strong style="color:'+tdColor(td)+'">'+tdLabel(td)+'</strong>'
      + '<span style="color:var(--t3)">'+cnt.toLocaleString('id-ID')+' trip · '+pct+'%</span>'
      + '</span>';
  });
  legendHtml += '</div>';

  container.innerHTML =
    '<div style="overflow-x:auto">'
    + '<table class="mtt"><thead>' + thead + '</thead><tbody>' + tbody + sumRow + '</tbody></table>'
    + '</div>'
    + legendHtml;
}

// ── DEMAND PANEL ─────────────────────────────────────────────────
function buildDemandPanel(container) {
  if(!container) return;
  var moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var SAT_SITES = new Set(['JABABEKA','CIKUPA']);

  // Sites list — ALL = 5 terpisah, group = 1 aggregate, sub-BU = 1
  var isGroup = (currentSite==='NDC_RDC'||currentSite==='NDC'||currentSite==='RDC');
  var SITES_LIST;
  if(currentSite==='ALL') SITES_LIST = SITES;
  else if(currentSite==='NDC_RDC') SITES_LIST = ['NDC_RDC'];
  else if(currentSite==='NDC') SITES_LIST = ['NDC'];
  else if(currentSite==='RDC') SITES_LIST = ['RDC'];
  else SITES_LIST = [currentSite];

  // Map group key → member sites
  var GROUP_MAP = {
    'NDC_RDC': SITES,
    'NDC':     SITES_NDC,
    'RDC':     SITES_RDC,
  };

  // Get all months up to feMonth
  var {start:fs, end:fe} = getRange();
  var feMonth = fe.slice(0,7);
  var allMonths = [...new Set(ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort().filter(mo=>mo<=feMonth);

  // Compute demand per site per month
  function computeDemand(rows, effectiveSite, site) {
    var isSAT = SAT_SITES.has(effectiveSite) && site !== 'JAB_FBI' && site !== 'JAB_KLS';
    var doC=0, doS=0, doH=0, doSat=0;
    var cbmC=0, cbmS=0, cbmH=0, cbmSat=0;
    rows.forEach(function(r) {
      var td = (r.td||'').toLowerCase();
      var do_ = parseFloat(r.do)||0;
      var cbm = parseFloat(r.cbm)||0;
      if(td==='customer')       { doC+=do_; cbmC+=cbm; }
      else if(td==='store')     { doS+=do_; cbmS+=cbm; }
      else if(td==='hub')       { doH+=do_; cbmH+=cbm; }
      else if(td==='satelite' && isSAT) { doSat+=do_; cbmSat+=cbm; }
    });
    return { doC, doS, doH, doSat: isSAT?doSat:null, cbmC, cbmS, cbmH, cbmSat: isSAT?cbmSat:null };
  }

  // Compute per month per site
  var allData = {};
  allMonths.forEach(function(mo) {
    var {start:moD1,end:moD2}=getMonthRange(mo);

    SITES_LIST.forEach(function(site) {
      var memberSites = GROUP_MAP[site]; // non-null if group key
      if(memberSites) {
        // Aggregate all member sites
        var agg = {doC:0,doS:0,doH:0,doSat:0,cbmC:0,cbmS:0,cbmH:0,cbmSat:0};
        var hasSat = false;
        memberSites.forEach(function(s) {
          var rows = filterRows(ROWS, moD1, moD2, s);
          var d = computeDemand(rows, s, s);
          agg.doC+=d.doC; agg.doS+=d.doS; agg.doH+=d.doH; agg.cbmC+=d.cbmC; agg.cbmS+=d.cbmS; agg.cbmH+=d.cbmH;
          if(d.doSat!=null){ agg.doSat+=d.doSat; agg.cbmSat+=d.cbmSat; hasSat=true; }
        });
        allData[mo+'|'+site] = {
          doC:agg.doC, doS:agg.doS, doH:agg.doH, doSat:hasSat?agg.doSat:null,
          cbmC:agg.cbmC, cbmS:agg.cbmS, cbmH:agg.cbmH, cbmSat:hasSat?agg.cbmSat:null,
        };
      } else {
        var effectiveSite = SUB_SITES[site] ? SUB_SITES[site].baseSite : site;
        var rows = filterRows(ROWS, moD1, moD2, site);
        allData[mo+'|'+site] = computeDemand(rows, effectiveSite, site);
      }
    });
  });

  // Format helpers
  function fmtN(v) { return v!=null ? Math.round(v).toLocaleString('id-ID') : '—'; }
  function fmtC(v) { return v!=null ? (+v.toFixed(1)).toLocaleString('id-ID') : '—'; }
  function momBadgeN(cur, prev) {
    if(cur==null||prev==null) return '';
    var d=cur-prev; if(Math.abs(d)<1) return '';
    var color=d>0?'#0f9d58':'#d93025';
    return '<br><span style="font-size:9px;font-weight:700;color:'+color+'">'+(d>0?'▲':'▼')+Math.abs(Math.round(d)).toLocaleString('id-ID')+'</span>';
  }

  // Build DO table
  function buildTable(type) {
    var isCBM = type==='cbm';
    var thead = '<tr>'
      +'<th style="text-align:left;min-width:70px">Bulan</th>'
      +'<th style="text-align:left;min-width:90px">Site</th>'
      +'<th class="num" style="min-width:90px">Customer</th>'
      +'<th class="num" style="min-width:80px">Store</th>'
      +'<th class="num" style="min-width:70px">Hub</th>'
      +'<th class="num" style="min-width:80px">Satelite*</th>'
      +'<th class="num" style="min-width:80px;background:#f8fafb">Total</th>'
      +'</tr>';

    var tbody = '';
    allMonths.forEach(function(mo, moIdx) {
      var prevMo = moIdx>0 ? allMonths[moIdx-1] : null;
      SITES_LIST.forEach(function(site) {
        var d = allData[mo+'|'+site]; if(!d) return;
        var prev = prevMo ? allData[prevMo+'|'+site] : null;
        var mn = moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
        var fmt = isCBM ? fmtC : fmtN;

        var vC   = isCBM ? d.cbmC   : d.doC;
        var vS   = isCBM ? d.cbmS   : d.doS;
        var vH   = isCBM ? d.cbmH   : d.doH;
        var vSat = isCBM ? d.cbmSat : d.doSat;
        var vTot = (vC||0)+(vS||0)+(vH||0)+(vSat||0);

        var pC   = prev ? (isCBM?prev.cbmC:prev.doC) : null;
        var pS   = prev ? (isCBM?prev.cbmS:prev.doS) : null;
        var pH   = prev ? (isCBM?prev.cbmH:prev.doH) : null;
        var pSat = prev ? (isCBM?prev.cbmSat:prev.doSat) : null;
        var pTot = prev ? ((pC||0)+(pS||0)+(pH||0)+(pSat||0)) : null;

        tbody += '<tr>'
          +'<td style="color:var(--t2);font-size:11px;white-space:nowrap">'+mn+'</td>'
          +'<td style="font-weight:600;font-size:11px">'+(SL[site]||site)+'</td>'
          +'<td class="num" style="font-size:11px;font-family:\'JetBrains Mono\',monospace">'+fmt(vC)+momBadgeN(vC,pC)+'</td>'
          +'<td class="num" style="font-size:11px;font-family:\'JetBrains Mono\',monospace">'+fmt(vS)+momBadgeN(vS,pS)+'</td>'
          +'<td class="num" style="font-size:11px;font-family:\'JetBrains Mono\',monospace">'+fmt(vH)+momBadgeN(vH,pH)+'</td>'
          +'<td class="num" style="font-size:11px;font-family:\'JetBrains Mono\',monospace;color:var(--t3)">'+(vSat!=null ? fmt(vSat)+momBadgeN(vSat,pSat) : '—')+'</td>'
          +'<td class="num" style="font-size:11px;font-family:\'JetBrains Mono\',monospace;font-weight:700;background:#f8fafb">'+fmt(vTot)+momBadgeN(vTot,pTot)+'</td>'
          +'</tr>';
      });
    });
    return '<div style="overflow-x:auto"><table class="mtt"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
  }

  var noteHtml = '<div style="padding:8px 16px;font-size:11px;color:var(--t3);border-top:1px solid var(--border)">'
    +'* Satelite hanya tersedia untuk HCI Jababeka & HCI Cikupa</div>';

  container.innerHTML =
    // DO table
    '<div class="panel" style="margin-bottom:14px">'
    +'<div class="ph"><h3>Demand — DO</h3><span class="tag">per type delivery</span></div>'
    +buildTable('do')
    +noteHtml
    +'</div>'

    // CBM table
    +'<div class="panel">'
    +'<div class="ph"><h3>Demand — CBM</h3><span class="tag">per type delivery</span></div>'
    +buildTable('cbm')
    +noteHtml
    +'</div>';
}

function generatePPT() {
  if(typeof PptxGenJS === 'undefined') { document.getElementById('pptStatus').textContent = '❌ Library belum load, refresh dulu'; return; }
  document.getElementById('pptStatus').textContent = '⏳ Generating...';

  var {start:s, end:e} = getRange();
  var moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var siteLabel = currentSite==='ALL'?'Semua Site':currentSite==='NDC_RDC'?'NDC & RDC':currentSite==='NDC'?'NDC':currentSite==='RDC'?'RDC':(SL[currentSite]||currentSite);

  // Only months within filter range
  var fsMonth = s.slice(0,7);
  var feMonth = e.slice(0,7);
  var allMonths = [...new Set(ROWS.map(function(r){return r.date?r.date.slice(0,7):null;}).filter(Boolean))].sort();
  allMonths = allMonths.filter(function(mo){return mo>=fsMonth && mo<=feMonth;});

  // BU definitions
  var BU_MAP = {
    'JABABEKA': [{key:'JABABEKA',label:'Corporate'},{key:'JAB_HCI',label:'HCI'},{key:'JAB_AHI',label:'AHI'},{key:'JAB_FBI',label:'FBI'},{key:'JAB_KLS',label:'KLS'}],
    'SDA':      [{key:'SDA',label:'Corporate'},{key:'SDA_HCI',label:'HCI'},{key:'SDA_AHI',label:'AHI'},{key:'SDA_FBI',label:'FBI'}],
    'CIKUPA':   [{key:'CIKUPA',label:'Corporate'}],
    'TALLO':    [{key:'TALLO',label:'Corporate'}],
    'TAMORA':   [{key:'TAMORA',label:'Corporate'}],
  };

  var SITE_LIST = currentSite==='ALL'||currentSite==='NDC_RDC'?SITES:currentSite==='NDC'?SITES_NDC:currentSite==='RDC'?SITES_RDC:SUB_SITES[currentSite]?[SUB_SITES[currentSite].baseSite]:[currentSite];

  var prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5 inches
  var CLR_TEXT='0f172a', CLR_GRAY='64748b', CLR_HDR='1e2a3a', CLR_GREEN='166534';

  // Cache results to avoid recomputing
  var _resCache = {};
  function getRes(buKey, mo) {
    var cacheKey = buKey+'|'+mo;
    if(_resCache[cacheKey] !== undefined) return _resCache[cacheKey];
    var dIM = new Date(parseInt(mo.slice(0,4)),parseInt(mo.slice(5,7)),0).getDate();
    var d1 = mo+'-'+String(parseInt(s.slice(8,10))).padStart(2,'0');
    var d2 = mo+'-'+String(Math.min(parseInt(e.slice(8,10)),dIM)).padStart(2,'0');
    var moF = filterRows(ROWS,d1,d2,buKey);
    var sub = SUB_SITES[buKey];
    var sr = sub ? moF : moF.filter(function(r){return r.site===(buKey==='JABABEKA'||buKey==='SDA'||buKey==='CIKUPA'||buKey==='TALLO'||buKey==='TAMORA'?buKey:buKey);});
    var result = computeSite(sr.length?sr:moF, buKey);
    _resCache[cacheKey] = result;
    return result;
  }

  // Pre-cache all results upfront
  function preCacheAll() {
    var months = allMonths.concat(allMonths.map(function(mo,i){return i>0?allMonths[i-1]:null;}).filter(Boolean));
    var uniqueMonths = [...new Set(months)];
    SITE_LIST.forEach(function(site){
      var bus = BU_MAP[site]||[{key:site,label:'Corporate'}];
      bus.forEach(function(bu){
        uniqueMonths.forEach(function(mo){ getRes(bu.key, mo); });
      });
    });
  }
  preCacheAll();

  function fmtV(v, type) {
    if(v==null) return '—';
    if(type==='pct') return (v*100).toFixed(1)+'%';
    if(type==='tat') return tatStr(v);
    if(type==='int') return Math.round(v).toLocaleString('id-ID');
    return v.toFixed(type||1);
  }

  function delta(cur, prev, type, hiGood) {
    if(cur==null||prev==null) return '';
    var d = cur-prev;
    if(Math.abs(d)<0.001) return '';
    var good = hiGood ? d>0 : d<0;
    var arrow = d>0?'▲':'▼';
    var color = good?'0f9d58':'d93025';
    var abs = Math.abs(d);
    var str;
    if(type==='pct') str=(abs*100).toFixed(1)+'%';
    else if(type==='tat'){var h=Math.floor(abs),m=Math.round((abs-h)*60);str=(h>0?h+'j ':'')+m+'m';}
    else if(type==='int') str=Math.round(abs).toLocaleString('id-ID');
    else str=abs<10?abs.toFixed(1):Math.round(abs).toString();
    return {text:arrow+' '+str, color:color};
  }

  function cell(txt, bold, color, align) {
    return {text:txt||'—', options:{fontSize:7.5,fontFace:'Calibri',bold:!!bold,color:color||CLR_TEXT,align:align||'center',valign:'middle'}};
  }

  function hdr(txt, color) {
    return {text:txt, options:{fontSize:7.5,fontFace:'Calibri',bold:true,color:'ffffff',fill:{type:'solid',color:color||CLR_HDR},align:'center',valign:'middle'}};
  }

  function deltaCell(d) {
    if(!d) return cell('—',false,CLR_GRAY);
    return {text:d.text, options:{fontSize:7,fontFace:'Calibri',bold:true,color:d.color,align:'center',valign:'middle'}};
  }

  // ── SLIDE 1: COVER ──
  var cov = prs.addSlide();
  cov.background={color:'1e2a3a'};
  cov.addText('Kawan Lama Group',{x:0.5,y:1.5,w:12.3,h:0.4,fontSize:13,color:'94a3b8',align:'center'});
  cov.addText('Transport Operations Performance',{x:0.5,y:2.0,w:12.3,h:0.65,fontSize:24,bold:true,color:'ffffff',align:'center'});
  cov.addText(siteLabel,{x:0.5,y:2.75,w:12.3,h:0.5,fontSize:18,bold:true,color:'86efac',align:'center'});
  var d1f=new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  var d2f=new Date(e).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  cov.addText(d1f+' s/d '+d2f,{x:0.5,y:3.3,w:12.3,h:0.35,fontSize:12,color:'94a3b8',align:'center'});

  // METRICS definition
  var METRICS = [
    {label:'Ritase',          key:'ritase',        type:1,    tgt:1.15, hi:true},
    {label:'OLF (Store)',     key:'olf',           type:'pct',tgt:0.85, hi:true},
    {label:'DP (Store)',      key:'dpStore',       type:1,    tgt:null, hi:true},
    {label:'DP (Mix)',        key:'dpMix',         type:1,    tgt:8.0,  hi:true},
    {label:'DP Non Reg',      key:'dpNonReg',      type:1,    tgt:null, hi:true},
    {label:'DP (Regular)',    key:'dpReg',         type:1,    tgt:8.0,  hi:true},
    {label:'DO/Trip (Reg)',   key:'doTrip',        type:1,    tgt:11.0, hi:true},
    {label:'DO/Trip (Mix)',   key:'doTripAll',     type:1,    tgt:null, hi:true},
    {label:'TAT Direct',      key:'tatDirect',     type:'tat',tgt:null, hi:false},
    {label:'TAT Store',       key:'tatStore',      type:'tat',tgt:null, hi:false},
    {label:'CBM Store',       key:'totalCbmStore', type:'int',tgt:null, hi:true},
    {label:'DO Customer',     key:'totalDoCust',   type:'int',tgt:null, hi:true},
    {label:'DP Customer',     key:'totalDpCust',   type:'int',tgt:null, hi:true},
  ];

  // ── PER SITE → 1 SLIDE PER MONTH ──
  SITE_LIST.forEach(function(site) {
    var bus = BU_MAP[site] || [{key:site,label:'Corporate'}];

    allMonths.forEach(function(mo, moIdx) {
      var prevMo = moIdx>0?allMonths[moIdx-1]:null;
      var moLabel = moNames[parseInt(mo.slice(5,7))-1]+' '+mo.slice(0,4);
      var prevLabel = prevMo?moNames[parseInt(prevMo.slice(5,7))-1]+' '+prevMo.slice(0,4):'—';
      var siteName = SL[site]||site;

      var sl = prs.addSlide();
      sl.background={color:'ffffff'};

      // Header
      sl.addText('Kawan Lama Group',{x:0.25,y:0.08,w:5,h:0.18,fontSize:7.5,color:'94a3b8'});
      sl.addText('Transport Operations Performance — '+siteName,{x:0.25,y:0.24,w:10,h:0.3,fontSize:13,bold:true,color:CLR_TEXT});
      sl.addText(moLabel+' vs '+prevLabel,{x:0.25,y:0.52,w:10,h:0.22,fontSize:9,color:CLR_GRAY});
      sl.addShape(prs.ShapeType.line,{x:0.25,y:0.77,w:12.83,h:0,line:{color:'e2e8f0',width:0.75}});

      // ── TABLE: rows=METRIC, cols=BU pair (prev | cur | delta) ──
      // Col widths: metric label (1.5) + per BU: prev(1.1) + cur(1.1) + delta(0.7) = 2.9
      // Max BUs: 5 (Jababeka) → 1.5 + 5*2.9 = 16 → too wide for 13.33
      // Use: metric(1.4) + per BU: prev(1.0) + cur(1.0) + delta(0.65) = 2.65
      // 5 BU: 1.4 + 5*2.65 = 14.65 → still wide
      // Limit display: metric(1.3) + BU(prev+cur+delta = 0.85+0.85+0.55=2.25)
      // 5 BU: 1.3+5*2.25=12.55 ✓

      var buW = 2.25; // width per BU group
      var metW = 1.3;
      var totalW = metW + bus.length*buW;
      var x0 = (13.33-totalW)/2;

      // Build header rows
      var hdrRow1 = [hdr('METRIK','2d3748')];
      bus.forEach(function(bu){
        hdrRow1.push({text:bu.label, options:{fontSize:8,fontFace:'Calibri',bold:true,color:'ffffff',fill:{type:'solid',color:CLR_HDR},align:'center',colspan:3}});
        hdrRow1.push(null); hdrRow1.push(null); // colspan placeholders
      });

      var hdrRow2 = [hdr('','2d3748')];
      bus.forEach(function(bu){
        hdrRow2.push(hdr(prevLabel,'374151'));
        hdrRow2.push(hdr(moLabel,'166534'));
        hdrRow2.push(hdr('Δ','64748b'));
      });

      // Build metric rows
      var tableRows = [hdrRow1, hdrRow2];
      METRICS.forEach(function(m) {
        var row = [cell(m.label,true,CLR_TEXT,'left')];
        bus.forEach(function(bu) {
          var cur = getRes(bu.key, mo);
          var prv = prevMo?getRes(bu.key, prevMo):null;
          var curV = cur?cur[m.key]:null;
          var prvV = prv?prv[m.key]:null;
          var d = delta(curV, prvV, m.type, m.hi);
          // Color cur value vs target
          var curColor = CLR_TEXT;
          if(m.tgt && curV!=null) {
            var pct = m.hi ? curV/m.tgt : m.tgt/curV;
            curColor = pct>=1.0?'166534':pct>=0.9?'92400e':'b91c1c';
          }
          row.push(cell(fmtV(prvV,m.type),false,CLR_GRAY));
          row.push({text:fmtV(curV,m.type),options:{fontSize:7.5,fontFace:'Calibri',bold:true,color:curColor,align:'center',valign:'middle'}});
          row.push(deltaCell(d));
        });
        tableRows.push(row);
      });

      // Col widths
      var colW = [metW];
      bus.forEach(function(){colW.push(0.75,0.85,0.65);});

      sl.addTable(tableRows,{
        x:x0, y:0.85, w:totalW,
        colW:colW,
        rowH:0.28,
        fontSize:7.5,
        fontFace:'Calibri',
        border:{type:'solid',pt:0.5,color:'e2e8f0'},
        align:'center',valign:'middle',
        color:CLR_TEXT,
      });

      // Footer
      sl.addText(siteName+' · '+moLabel+' vs '+prevLabel,{x:0.25,y:7.3,w:12.83,h:0.15,fontSize:6.5,color:'cbd5e1'});
    });
  });

  var fname='TOP_'+siteLabel.replace(/\s/g,'_')+'_'+s.slice(0,7)+'_'+e.slice(0,7)+'.pptx';
  prs.writeFile({fileName:fname}).then(function(){
    document.getElementById('pptStatus').textContent='✅ Downloaded: '+fname;
  }).catch(function(err){
    document.getElementById('pptStatus').textContent='❌ Error: '+err.message;
  });
}

function openPresentation() {
  var {start:s, end:e} = getRange();
  var moNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var siteLabel = currentSite==='ALL'?'Semua Site':currentSite==='NDC_RDC'?'NDC & RDC':currentSite==='NDC'?'NDC':currentSite==='RDC'?'RDC':(SL[currentSite]||currentSite);

  // Active month + previous month only (MoM)
  var feMonth = e.slice(0,7);
  var allMonthsSorted = [...new Set(ROWS.map(r=>r.date?r.date.slice(0,7):null).filter(Boolean))].sort();
  var feIdx = allMonthsSorted.indexOf(feMonth);
  var showMonths = feIdx > 0 ? [allMonthsSorted[feIdx-1], feMonth] : [feMonth];
  var prevMo = showMonths.length > 1 ? showMonths[0] : null;
  var curMo  = showMonths[showMonths.length-1];

  // Sites to present
  var SITE_ORDER = currentSite==='ALL'||currentSite==='NDC_RDC' ? SITES :
                   currentSite==='NDC' ? SITES_NDC :
                   currentSite==='RDC' ? SITES_RDC :
                   SUB_SITES[currentSite] ? [SUB_SITES[currentSite].baseSite] : [currentSite];

  // Per site: define rows to show (corporate + sub-BU if Jababeka)
  var JAB_BUS = [
    {key:'JABABEKA', label:'Corporate'},
    {key:'JAB_HCI',  label:'HCI'},
    {key:'JAB_AHI',  label:'AHI'},
    {key:'JAB_FBI',  label:'FBI'},
    {key:'JAB_KLS',  label:'KLS'},
  ];

  // Helper: compute result
  // Reset caches — pastikan tidak ada stale data dari sesi sebelumnya
  var _cache = {}, _ucache = {}, _ccache = {}, _tcache = {};
  function getRes(site, mo) {
    var k=site+'|'+mo; if(_cache[k]) return _cache[k];
    var {start:d1,end:d2}=getMonthRange(mo);
    var rows=filterRows(ROWS,d1,d2,site);
    _cache[k]=computeSite(rows,site)||{}; return _cache[k];
  }
  function getUtil(site, mo) {
    var k=site+'|'+mo; if(_ucache[k]!==undefined) return _ucache[k];
    var {start:d1,end:d2}=getMonthRange(mo);
    var r=filterUtilRows(d1,d2,site);
    _ucache[k]=r.rows.length?computeUtil(r.rows,r.allRows,site):null; return _ucache[k];
  }

  function getCost(site, mo) {
    var k=site+'|'+mo; if(_ccache[k]!==undefined) return _ccache[k];
    var {start:d1,end:d2}=getMonthRange(mo);
    var rows=filterRows(ROWS,d1,d2,site);
    _ccache[k]=computeCost(rows); return _ccache[k];
  }

  function getTripByType(site, mo) {
    var k=site+'|'+mo; if(_tcache[k]!==undefined) return _tcache[k];
    var {start:d1,end:d2}=getMonthRange(mo);
    var rows=filterRows(ROWS,d1,d2,site);
    var sets={customer:new Set(),store:new Set(),hub:new Set(),satelite:new Set(),other:new Set(),total:new Set()};
    rows.forEach(function(r){
      if(!r.lc) return;
      var td=(r.td||'').toLowerCase().trim();
      sets.total.add(r.lc);
      if(td==='customer') sets.customer.add(r.lc);
      else if(td==='store') sets.store.add(r.lc);
      else if(td==='hub') sets.hub.add(r.lc);
      else if(td==='satelite') sets.satelite.add(r.lc);
      else sets.other.add(r.lc);
    });
    _tcache[k]={c:sets.customer.size,s:sets.store.size,h:sets.hub.size,sat:sets.satelite.size,oth:sets.other.size,tot:sets.total.size};
    return _tcache[k];
  }

  // Format helpers
  function pct(v)   { return v!=null?(v*100).toFixed(1)+'%':'—'; }
  function num(v,d) { return v!=null?(+v.toFixed(d||1)).toLocaleString('id-ID'):'—'; }
  function fmtTAT(h){ if(h==null)return '—'; var hh=Math.floor(h),mm=Math.round((h-hh)*60); return hh+':'+(mm<10?'0':'')+mm; }
  function badge(cur,prev,isLow,isRaw,dec){
    if(cur==null||prev==null) return '';
    var d=cur-prev; if(Math.abs(d)<0.001) return '';
    var up=isLow?d<0:d>0;
    var label=isRaw?Math.abs(d).toFixed(dec||1):(Math.abs(d)*100).toFixed(1)+'%';
    return '<span class="bdg '+(up?'up':'dn')+'">'+(d>0?'▲':'▼')+label+'</span>';
  }

  function buildRow(buKey, buLabel, mo, prevMo, isCorpRow) {

      +'<td>'+num(d.doTrip,1)+badge(d.doTrip,prev?.doTrip,false,true,1)+'</td>'

      +'<td>'+fmtTAT(d.tatStore)+badge(d.tatStore,prev?.tatStore,true,true,1)+'</td>'
      +'<td class="'+(u?(u.drvUtil>=95?'g':u.drvUtil>=85?'y':'r'):'')+'">'+( u?pct(u.drvUtil/100):'—')+(u&&up?badge(u.drvUtil/100,up.drvUtil/100,false,false):'')+'</td>'
      +'<td class="'+(u?(u.armUtilPct>=95?'g':u.armUtilPct>=85?'y':'r'):'')+'">'+( u?pct(u.armUtilPct/100):'—')+(u&&up?badge(u.armUtilPct/100,up.armUtilPct/100,false,false):'')+'</td>'
      +'<td>'+(u?num(u.ritaseArmada,2):'—')+'</td>'
      +'<td>'+(u?num(u.ritaseMpp,2):'—')+'</td>'

  // Build thead
  var thead = '<thead><tr>'
    +'<th style="text-align:left;min-width:90px">BU</th>'
    +'<th>Ritase</th><th>OLF</th>'
    +'<th>DP Store</th><th>DP Mix</th><th>DP Reg</th><th>DO/Trip</th>'
    +'<th>TAT Direct</th><th>TAT Store</th>'
    +'<th>UTL Driver</th><th>UTL Armada</th><th>Rit. Armada</th><th>Rit. MPP</th>'
    +'</tr></thead>';

  // Build slide content per site
  // ── Auto Insight ──
  function buildInsight(site, curMo, prevMo) {
    if(!prevMo) return '<div style="color:#94a3b8;font-size:11px;padding:8px">Tidak ada data bulan sebelumnya.</div>';

    // Ritase target per site
    var RIT_TGT = {JABABEKA:1.15,JAB_HCI:1.15,JAB_AHI:1.15,JAB_FBI:1.15,JAB_KLS:1.15,CIKUPA:1.05,SDA:1.07,TALLO:1.25,TAMORA:1.25};
    var buList2 = site==='JABABEKA' ? JAB_BUS : [{key:site,label:'Corporate'}];
    var insights = [];
    var effectiveSite = SUB_SITES[site] ? SUB_SITES[site].baseSite : site;

    function chg(cur, prev, pct) {
      if(cur==null||prev==null||prev===0) return null;
      return pct ? (cur-prev)/prev*100 : cur-prev;
    }

    buList2.forEach(function(bu) {
      var lbl = bu.label;
      var dc = getRes(bu.key, curMo), dp = getRes(bu.key, prevMo);
      var cc = getCost(bu.key, curMo), cp = getCost(bu.key, prevMo);
      var uc = getUtil(bu.key, curMo), up2 = getUtil(bu.key, prevMo);
      var tc = getTripByType(bu.key, curMo), tp2 = getTripByType(bu.key, prevMo);
      var ritTgt = RIT_TGT[bu.key] || RIT_TGT[effectiveSite] || 1.15;

      // Changes
      var doCustChg  = chg(tc.c, tp2.c, true);
      var doStoreChg = chg(tc.s, tp2.s, true);
      var olfChg     = dc.olf!=null&&dp.olf!=null ? (dc.olf-dp.olf)*100 : null;
      var ritChg     = chg(dc.ritase, dp.ritase, true);
      var doTripChg  = chg(dc.doTripAll, dp.doTripAll, true);
      var dpMixChg   = chg(dc.dpMix, dp.dpMix, true);
      var costDoCustChg = chg(cc?.costDoCust, cp?.costDoCust, true);
      var armUtlChg  = uc&&up2 ? uc.armUtilPct - up2.armUtilPct : null;

      var pts = [];

      // 1. Demand Customer → lever: DO/Trip & DP/Trip
      if(doCustChg!=null && Math.abs(doCustChg) > 3) {
        var demDir = doCustChg>0 ? 'naik' : 'turun';
        var demCol = doCustChg>0 ? '#166534' : '#991b1b';
        pts.push({icon:doCustChg>0?'📈':'📉', color:demCol,
          text:'<b>'+lbl+'</b>: Demand Customer '+demDir+' <b>'+Math.abs(doCustChg).toFixed(1)+'%</b> MoM ('+tc.c+' trip)'});

        // Korelasi dengan DO/Trip (lever customer)
        if(doTripChg!=null) {
          if(doCustChg>3 && doTripChg>2) pts.push({icon:'✅',color:'#166534',
            text:'<b>'+lbl+'</b>: Demand Customer naik, DO/Trip ikut naik '+doTripChg.toFixed(1)+'% — efisiensi routing membaik'});
          else if(doCustChg>3 && doTripChg<-2) pts.push({icon:'⚠️',color:'#b45309',
            text:'<b>'+lbl+'</b>: Demand Customer naik tapi DO/Trip turun — perlu optimasi routing & DP Customer'});
        }
      }

      // 2. Demand Store → lever: OLF
      if(doStoreChg!=null && Math.abs(doStoreChg) > 3) {
        var sDir = doStoreChg>0 ? 'naik' : 'turun';
        var sCol = doStoreChg>0 ? '#166534' : '#991b1b';
        pts.push({icon:doStoreChg>0?'📈':'📉', color:sCol,
          text:'<b>'+lbl+'</b>: Demand Store '+sDir+' <b>'+Math.abs(doStoreChg).toFixed(1)+'%</b> MoM ('+tc.s+' trip)'});

        // Korelasi dengan OLF (lever store)
        if(olfChg!=null && dc.olf!=null) {
          if(doStoreChg>3 && olfChg>1) pts.push({icon:'✅',color:'#166534',
            text:'<b>'+lbl+'</b>: Demand Store naik, OLF naik '+olfChg.toFixed(1)+'%pts → '+(dc.olf*100).toFixed(1)+'%'});
          else if(doStoreChg>3 && olfChg<-1) pts.push({icon:'⚠️',color:'#b45309',
            text:'<b>'+lbl+'</b>: Demand Store naik tapi OLF turun '+Math.abs(olfChg).toFixed(1)+'%pts — perlu optimasi muatan armada'});
        }
      }

      // 3. OLF vs threshold 85%
      if(dc.olf!=null) {
        if(dc.olf < 0.85) pts.push({icon:'🔴',color:'#991b1b',
          text:'<b>'+lbl+'</b>: OLF <b>'+(dc.olf*100).toFixed(1)+'%</b> — di bawah target 85%'+(olfChg!=null&&olfChg<-1?' (↓'+Math.abs(olfChg).toFixed(1)+'%pts)':'')});
      }

      // 4. Ritase Armada vs target + korelasi dengan total demand
      var totalDemandChg = chg(tc.tot, tp2.tot, true);
      if(dc.ritase!=null) {
        if(dc.ritase < ritTgt) pts.push({icon:'🔴',color:'#991b1b',
          text:'<b>'+lbl+'</b>: Ritase Armada <b>'+dc.ritase.toFixed(2)+'</b> — di bawah target '+ritTgt.toFixed(2)});
        else if(totalDemandChg!=null && totalDemandChg>3 && ritChg!=null && ritChg>2) pts.push({icon:'✅',color:'#166534',
          text:'<b>'+lbl+'</b>: Ritase Armada naik '+ritChg.toFixed(1)+'% — berhasil handle kenaikan demand'});
        else if(totalDemandChg!=null && totalDemandChg>3 && ritChg!=null && ritChg<-2) pts.push({icon:'⚠️',color:'#b45309',
          text:'<b>'+lbl+'</b>: Demand naik tapi Ritase turun — perlu tingkatkan ritase armada & MPP'});
      }

      // 5. Cost/DO Customer vs demand
      if(costDoCustChg!=null && doCustChg!=null) {
        if(costDoCustChg>5 && doCustChg<0) pts.push({icon:'🔴',color:'#991b1b',
          text:'<b>'+lbl+'</b>: Cost/DO Cust naik '+costDoCustChg.toFixed(1)+'% saat demand turun — ineffisiensi cost'});
        else if(costDoCustChg<-3 && doCustChg>0) pts.push({icon:'✅',color:'#166534',
          text:'<b>'+lbl+'</b>: Demand naik, Cost/DO Cust turun '+Math.abs(costDoCustChg).toFixed(1)+'% — scale economy'});
      }

      // 6. UTL Armada
      if(uc && armUtlChg!=null) {
        if(uc.armUtilPct < 85) pts.push({icon:'🔴',color:'#991b1b',
          text:'<b>'+lbl+'</b>: UTL Armada <b>'+uc.armUtilPct.toFixed(1)+'%</b> — di bawah 85%'});
        else if(armUtlChg < -5) pts.push({icon:'⚠️',color:'#b45309',
          text:'<b>'+lbl+'</b>: UTL Armada turun '+Math.abs(armUtlChg).toFixed(1)+'%pts MoM → '+uc.armUtilPct.toFixed(1)+'%'});
      }

      insights = insights.concat(pts);
    });

    if(!insights.length) {
      insights.push({icon:'✅',color:'#166534',text:'Semua metrik dalam kondisi normal — tidak ada anomali signifikan MoM'});
    }

    // Cap at 8 insights
    insights = insights.slice(0,8);

    return '<div style="display:flex;flex-direction:column;gap:5px;padding:2px 0">'
      +insights.map(function(ins){
        return '<div style="display:flex;gap:6px;align-items:flex-start;font-size:10px;line-height:1.4;color:'+ins.color+'">'
          +'<span style="font-size:11px;flex-shrink:0">'+ins.icon+'</span>'
          +'<span>'+ins.text+'</span>'
          +'</div>';
      }).join('')
      +'</div>';
  }

    buList.forEach(function(bu,i){
      if(i>0) costBody+='<tr><td colspan="11" style="padding:1px 0;border:none;background:#f1f5f9"></td></tr>';
      var lbl=(i===0?'<b>':'')+bu.label+(i===0?'</b>':'');
      var cc=getCost(bu.key,curMo), cp=prevMo?getCost(bu.key,prevMo):null;
      if(prevMo&&cp) costBody+='<tr'+(i===0?' class="corp-row"':'')+'><td class="bu-label">'+lbl+' <span style="font-size:8px;color:#94a3b8">'+mnPrev+'</span></td>'
        +'<td>'+fmtM(cp.cost)+'</td><td>'+fmtM(cp.ujp)+'</td><td>'+cp.trip+'</td>'
        +'<td>'+fmtK(cp.costTrip)+'</td><td>'+fmtK(cp.costDoCust)+'</td><td>'+fmtK(cp.costDoStore)+'</td><td>'+fmtK(cp.costDoHub)+'</td>'
        +'<td>'+fmtK(cp.costCbmCust)+'</td><td>'+fmtK(cp.costCbmStore)+'</td><td>'+fmtK(cp.costCbmHub)+'</td></tr>';
      costBody+='<tr'+(i===0?' class="corp-row"':'')+'><td class="bu-label">'+lbl+' <span style="font-size:8px;font-weight:700">'+mnCur+'</span></td>'
        +'<td style="color:#1d4ed8;font-weight:700">'+fmtM(cc?.cost)+(cp?bdgN(cc?.cost,cp?.cost,false,'jt'):'')+'</td>'
        +'<td>'+fmtM(cc?.ujp)+'</td><td>'+(cc?cc.trip:'—')+'</td>'
        +'<td>'+fmtK(cc?.costTrip)+(cp?bdgN(cc?.costTrip,cp?.costTrip,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costDoCust)+(cp?bdgN(cc?.costDoCust,cp?.costDoCust,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costDoStore)+(cp?bdgN(cc?.costDoStore,cp?.costDoStore,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costDoHub)+(cp?bdgN(cc?.costDoHub,cp?.costDoHub,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costCbmCust)+(cp?bdgN(cc?.costCbmCust,cp?.costCbmCust,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costCbmStore)+(cp?bdgN(cc?.costCbmStore,cp?.costCbmStore,true,'rb'):'')+'</td>'
        +'<td>'+fmtK(cc?.costCbmHub)+(cp?bdgN(cc?.costCbmHub,cp?.costCbmHub,true,'rb'):'')+'</td></tr>';
    });

    return '<div class="prs-slide-inner">'
      // Header
      +'<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">'
      +'<div class="prs-site-label">'+siteName+'</div>'
      +'<div class="prs-mom-label">'+momLabel+'</div>'
      +'</div>'
      // 2x2 grid
      +'<div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px">'
      // Top-left: Metrik
      +'<div class="prs-section">'
      +'<div class="prs-sec-title">📊 Produktivitas</div>'
      +'<div class="prs-tbl-wrap"><table class="prs-tbl">'+metrikThead+'<tbody>'+metrikBody+'</tbody></table></div>'
      +'</div>'
      // Top-right: Cost
      +'<div class="prs-section">'
      +'<div class="prs-sec-title">💰 Cost Analysis</div>'
      +'<div class="prs-tbl-wrap"><table class="prs-tbl">'+costThead+'<tbody>'+costBody+'</tbody></table></div>'
      +'</div>'
      // Bottom-left: Trip only
      +'<div class="prs-section">'
      +'<div class="prs-sec-title">🚛 Trip per Type</div>'
      +'<div class="prs-tbl-wrap"><table class="prs-tbl">'+tripThead+'<tbody>'+tripBody+'</tbody></table></div>'
      +'</div>'
      // Bottom-right: Demand left (wider), Insight right (narrower)
      +'<div class="prs-section" style="display:flex;gap:12px">'
      +'<div style="flex:1.4;min-width:0">'
      +'<div class="prs-sec-title">📦 Demand</div>'
      +'<div class="prs-tbl-wrap"><table class="prs-tbl">'+demandThead+'<tbody>'+demandBody+'</tbody></table></div>'
      +'</div>'
      +'<div style="flex:0.6;min-width:0;overflow:hidden">'
      +'<div class="prs-sec-title">💡 Insight</div>'
      +buildInsight(site, curMo, prevMo)
      +'</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }

  // Build slides list: cover + 1 per site
  var slides = [{type:'cover'}];
  SITE_ORDER.forEach(function(site){ slides.push({type:'site', site}); });

  var slidesHTML = slides.map(function(sl,i){
    var content;
    if(sl.type==='cover'){
      var d1=new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
      var d2=new Date(e).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
      content='<div class="prs-cover">'
        +'<div class="prs-logo">TOP — Transport Operations Performance</div>'
        +'<h1>'+siteLabel+'</h1>'
        +'<div class="prs-periode">'+d1+' s/d '+d2+'</div>'
        +'<div class="prs-fm">'+(fullMonthMode?'Mode: Full Month':'Mode: Range Date')+'</div>'
        +'</div>';
    } else {
      content = buildSiteSlide(sl.site);
    }
    return '<div class="prs-slide" id="slide-'+i+'">'+content+'</div>';
  }).join('');

  var html='<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">'
    +'<title>TOP Presentation — '+siteLabel+'</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{background:#111;font-family:Inter,system-ui,sans-serif;overflow:hidden}'
    +'.prs-slide{width:100vw;height:100vh;display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px 32px;background:#f8fafc}'
    +'.prs-slide.active{display:flex}'
    +'.prs-cover{text-align:center}'
    +'.prs-logo{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:2px;margin-bottom:20px}'
    +'.prs-cover h1{font-size:52px;font-weight:800;color:#0f172a;margin-bottom:14px}'
    +'.prs-periode{font-size:20px;color:#475569;font-weight:500}'
    +'.prs-fm{margin-top:8px;font-size:12px;color:#94a3b8}'
    +'.prs-metrics{width:100%;max-width:1500px}'
    +'.prs-slide-inner{width:100%;max-width:1600px}'
    +'.prs-section{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:8px;overflow:hidden}'
    +'.prs-sec-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f1f5f9}'
    +'.prs-site-label{font-size:24px;font-weight:800;color:#0f172a;border-left:5px solid #16a34a;padding-left:12px}'
    +'.prs-mom-label{font-size:13px;color:#64748b;font-weight:600}'
    +'.prs-tbl-wrap{overflow-x:auto}'
    +'.prs-tbl{width:100%;border-collapse:collapse;font-size:10px}'
    +'.prs-tbl th{background:#1e2a3a;color:#fff;padding:5px 7px;text-align:right;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}'
    +'.prs-tbl th:first-child{text-align:left}'
    +'.prs-tbl td{padding:5px 7px;text-align:right;border-bottom:1px solid #e2e8f0;white-space:nowrap}'
    +'.bu-label{text-align:left!important;color:#334155}'
    +'.corp-row td{background:#f0fdf4!important;border-top:2px solid #16a34a}'
    +'.prs-tbl td.g{color:#166534;font-weight:700;background:#dcfce7!important}'
    +'.prs-tbl td.y{color:#854d0e;font-weight:700;background:#fef9c3!important}'
    +'.prs-tbl td.r{color:#991b1b;font-weight:700;background:#fee2e2!important}'
    +'.bdg{display:inline-block;font-size:9px;font-weight:700;margin-left:3px}'
    +'.bdg.up{color:#16a34a}.bdg.dn{color:#dc2626}'
    +'.prs-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.75);padding:8px 18px;border-radius:99px;z-index:100}'
    +'.prs-btn{background:#fff;color:#0f172a;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}'
    +'.prs-btn:hover{background:#e2e8f0}'
    +'.prs-counter{color:#fff;font-size:12px;font-weight:600;min-width:55px;text-align:center}'
    +'.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;margin:0 2px}'
    +'.dot.active{background:#fff}'
    +'.prs-esc{position:fixed;top:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;z-index:100}'
    +'</style></head><body>'
    +slidesHTML
    +'<div class="prs-nav">'
    +'<button class="prs-btn" onclick="prev()">◀</button>'
    +'<div id="dots" style="display:flex"></div>'
    +'<span class="prs-counter" id="counter">1/'+slides.length+'</span>'
    +'<button class="prs-btn" onclick="next()">▶</button>'
    +'</div>'
    +'<button class="prs-esc" onclick="window.close()">✕ Tutup</button>'
    +'<script>'
    +'var cur=0,total='+slides.length+';'
    +'var els=document.querySelectorAll(".prs-slide");'
    +'var dotsEl=document.getElementById("dots");'
    +'for(var i=0;i<total;i++){var d=document.createElement("div");d.className="dot"+(i===0?" active":"");d.setAttribute("data-i",i);d.onclick=function(){goTo(+this.getAttribute("data-i"));};dotsEl.appendChild(d);}'
    +'function goTo(n){els[cur].classList.remove("active");dotsEl.children[cur].classList.remove("active");cur=Math.max(0,Math.min(total-1,n));els[cur].classList.add("active");dotsEl.children[cur].classList.add("active");document.getElementById("counter").textContent=(cur+1)+"/"+total;}'
    +'function next(){goTo(cur+1);}function prev(){goTo(cur-1);}'
    +'document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key==="ArrowDown")next();if(e.key==="ArrowLeft"||e.key==="ArrowUp")prev();if(e.key==="Escape")window.close();});'
    +'goTo(0);'
    +'<\/script>'
    +'</body></html>';

  var w=window.open('','_blank');
  if(!w){alert('Pop-up diblock browser. Izinkan pop-up dulu ya.');return;}
  w.document.write(html);
  w.document.close();
}



</script>
